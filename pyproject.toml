[project]
name = "course-generator"
version = "0.1.0"
description = "Generador genérico de cursos técnicos profundos, lección por lección."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
]

[project.scripts]
course-generator = "course_generator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_generator"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0.12.20260906",
]
