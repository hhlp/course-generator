course:
  title: "English Grammar C1 → C2"
  language: "es"
  target_language: "en"
  level:
    from: "C1"
    to: "C2"
    framework: "CEFR"
  scope: "grammar-only"
  primary_reference: "Advanced Grammar in Use, 4th Edition — Martin Hewings"
  independent_course: true
  block_start: 0

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

objective:
  primary: >-
    Desarrollar un dominio profundo, progresivo y analítico de la gramática
    inglesa avanzada desde C1 hasta C2, prestando especial atención a la
    relación entre forma, significado, estructura, restricciones y elección
    entre construcciones gramaticales alternativas.

curriculum:
  grammar_required: true
  independent_strands:
    vocabulary: false
    pronunciation: false
    reading: false
    listening: false
    writing: false
    speaking: false
    integrated_skills: false
  incidental_context_allowed: true
  incidental_context_rule: >-
    El vocabulario y las oraciones contextuales pueden utilizarse para demostrar
    gramática, pero nunca deben convertirse en objetivos independientes de la lección.

level_model:
  type: "continuum"
  artificial_c1_c2_split: false
  progression:
    - recognition
    - form
    - meaning
    - use
    - contrast
    - constraints
    - exceptions
    - manipulation
    - grammatical_choice
    - structural_analysis
    - error_diagnosis
    - mastery
  global_progression:
    A2: "introduce and establish"
    B1: "consolidate and extend"
    B2: "contrast and use complex structures"
    C1: "advanced structures and exceptions"
    C2: "mastery, nuance and grammatical analysis"
  avoid_repetition_without_new_depth: true

pedagogy:
  style: "profundo, práctico, progresivo, contrastivo y orientado al dominio gramatical"
  explanation_language: "Spanish"
  grammar_terminology: "English"
  examples_language: "English"
  indentation: false
  numbering: "single-level"
  explain_terminology: true
  contrastive_examples: true
  positive_and_negative_examples: true
  explain_form_meaning_relationship: true
  explain_constraints: true
  compare_alternative_constructions: true
  error_analysis: true
  structural_analysis: true
  require_natural_examples: true
  require_original_exercises: true
  avoid_unnecessary_repetition: true

lesson_structure:
  objective:
    required: true
    position: first
    heading: "🎯 OBJETIVO"
  reading:
    required: true
    heading: "📚 LECTURA"
    purpose: "referencia bibliográfica gramatical; no actividad de comprensión lectora"
    categories:
      - principal
      - normativa
      - profundizacion
      - consulta
    exact_references_only_when_verified: true
  explanation:
    required: true
    heading: "📘 GRAMMAR"
    requirements:
      - "Definir la estructura gramatical con precisión."
      - "Mostrar su forma o patrón cuando sea útil."
      - "Explicar significado, función y elección gramatical."
      - "Explicar restricciones y excepciones importantes."
      - "Contrastar construcciones próximas cuando corresponda."
      - "Relacionar forma, significado, estructura y contexto gramatical."
  examples:
    required: true
    heading: "💬 EXAMPLES"
    requirements:
      - "Incluir ejemplos naturales y gramaticalmente precisos."
      - "Incluir contrastes mínimos cuando sean útiles."
      - "Explicar por qué cambia el significado, la aceptabilidad o la estructura."
      - "Permitir ejemplos avanzados adecuados a C1-C2."
  practice:
    required: true
    heading: "🧪 Laboratorio/ejemplos"
    purpose: "manipulación, transformación, contraste, diagnóstico y análisis gramatical avanzado"
  common_errors:
    required: false
    heading: "⚠️ Errores frecuentes"
  important_idea:
    required: false
    heading: "💡 Idea importante"
  grammatical_analysis:
    required: false
    heading: "🔬 ANÁLISIS GRAMATICAL"
    use_when:
      - "la estructura tenga varios niveles de cláusula"
      - "exista ambigüedad estructural"
      - "sea necesario distinguir complemento y adjunto"
      - "sea útil identificar constituyentes o funciones"
      - "la elección entre construcciones dependa de restricciones sintácticas o semánticas"
  remember:
    required: true
    position: last
    heading: "🧠 QUÉ DEBES RECORDAR"
    min_items: 3
    max_items: 7
    avoid_repeating_objective: true

examples:
  target_language: "English"
  explanation_language: "Spanish"
  require_natural_examples: true
  allow_advanced_examples: true
  prefer_contrast_pairs: true
  mark_ungrammatical_examples: true
  ungrammatical_marker: "*"
  explain_acceptability: true

content_rules:
  grammar_only: true
  no_independent_vocabulary_lessons: true
  no_independent_pronunciation_lessons: true
  no_independent_reading_lessons: true
  no_independent_listening_lessons: true
  no_independent_writing_lessons: true
  no_independent_speaking_lessons: true
  no_generic_conversation_lessons: true
  no_exam_preparation_blocks: true
  include_common_errors: true
  include_exceptions_when_level_relevant: true
  include_sentence_analysis: true
  include_transformations: true
  include_consolidation_lessons: true
  include_checkpoints: true
  include_final_mastery_project: true
  preserve_english_examples: true
  preserve_level_continuity: true

references:
  principal:
    - author: "Martin Hewings"
      title: "Advanced Grammar in Use"
      edition: "4th Edition"
      role: "principal pedagogical grammar and backbone"
  advanced:
    - title: "The Cambridge Grammar of the English Language"
      role: "advanced syntactic reference"
    - title: "A Comprehensive Grammar of the English Language"
      role: "advanced descriptive reference"
    - title: "Longman Grammar of Spoken and Written English"
      role: "corpus and grammatical variation reference"
  supporting:
    - title: "Practical English Usage"
      role: "advanced learner usage consultation"
  citation_policy:
    exact_references_only_when_verified: true
    never_invent_page_numbers: true
    never_invent_unit_numbers: true
    distinguish_primary_from_supplementary: true
    paraphrase_sources: true
    do_not_copy_source_exercises: true

generation:
  lesson_depth: "high"
  standalone_lessons: true
  cumulative_progression: true
  avoid_unnecessary_repetition: true
  preserve_cross_references: true
  checkpoints:
    - "C1 advanced grammar"
    - "C1 → C2 progression"
    - "C2 mastery"
    - "Final C1 → C2 integration"

quality_checks:
  require_objective_first: true
  require_remember_last: true
  verify_lesson_is_grammar_focused: true
  verify_examples_support_grammar_target: true
  verify_terminology_is_explained: true
  verify_contrasts_are_semantically_accurate: true
  verify_no_skill_block_drift: true
  verify_no_unverified_exact_bibliographic_reference: true
  verify_level_boundaries: true
  verify_constraints_are_explained: true
  verify_acceptability_judgments_are_explained: true

level_specific:
  boundaries:
    from: "C1"
    to: "C2"
    rule: >-
      Evitar repetir contenidos B1-B2 salvo cuando se estudien con nueva profundidad,
      restricciones, excepciones, variación, análisis estructural o elección gramatical avanzada.
  required_topics:
    preserve_c1_c2_continuity: true
    advanced_constraints: true
    alternative_constructions: true
    grammatical_choice: true
    structural_analysis: true
    error_diagnosis: true
    acceptability_analysis: true
    final_mastery_project: true
