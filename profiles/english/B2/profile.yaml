  common_errors:
    required: true
    heading: ⚠️ Errores frecuentes
  important_idea:
    required: false
    heading: 💡 Idea importante
  grammatical_analysis:
    required: false
    heading: 🔬 ANÁLISIS GRAMATICAL
    use_when:
