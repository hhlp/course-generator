level_specific:
  boundaries:
    from: B1
    to: B2
    rule: Consolidar estructuras introducidas en A2 solo cuando
      exista nueva profundidad, contraste, restricción, excepción
      o integración propia de B1-B2. En B2 se permite análisis
      de word, phrase, clause, sentence, constituent, head, modifier,
      complement, adjunct y funciones gramaticales cuando apoye
      la comprensión; no desarrollar como objetivo central la
      gramática avanzada reservada para C1-C2.
  required_topics:
    contrastive_teaching: true
    exceptions_when_level_relevant: true
    sentence_analysis: true
    transformations: true
    consolidation: true
    phrase_and_clause_structure: true
    grammatical_functions: true
    complementation_and_modification: true
    information_structure_introduction: true
  c1_c2_boundary:
    introduce_but_do_not_exhaust:
      - conditional_inversion
      - negative_inversion
      - fronting
      - clefts
      - extraposition
      - structural_ambiguity
    reserve_deep_mastery_for_c1_c2:
      - advanced_inversion
      - advanced_information_packaging
      - advanced_nominalisation
      - advanced_complementation
      - advanced_discourse_grammar
      - marked_word_order
    policy: Los contenidos puente pueden introducirse de forma
      limitada en B2, pero su análisis sistemático, excepciones
      avanzadas, variación discursiva y dominio formal pertenecen
      al path C1-C2.
    do_not_use_as_b2_core_references:
      - Cambridge Grammar of English — Carter & McCarthy
      - The Cambridge Grammar of the English Language — Huddleston
        & Pullum
