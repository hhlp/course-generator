  independent_course: true
  block_start: 0
files:
  pedagogy: ../../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md
objective:
  primary: Consolidar y ampliar la gramática inglesa desde B1
    hasta B2 mediante un estudio progresivo y contrastivo de forma,
    significado, uso, restricciones, transformaciones y relaciones
    entre estructuras gramaticales.
