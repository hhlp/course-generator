---
course:
  title: English Grammar B1 → B2
  language: es
  target_language: en
  level:
    from: B1
    to: B2
    framework: CEFR
  scope: grammar-only
  primary_reference: English Grammar in Use, Fifth Edition — Raymond Murphy
  independent_course: true
  block_start: 0

files:
  # Preserve until the repository loader and directory layout are verified.
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

objective:
  primary: Consolidar y ampliar la gramática inglesa desde B1 hasta B2 mediante
      un estudio progresivo y contrastivo de forma, significado, uso,
      restricciones, transformaciones y relaciones entre estructuras
      gramaticales.
curriculum:
  grammar_required: true
  independent_strands:
    vocabulary: false
    pronunciation: false
    reading: false
    listening: false
    writing: false
    speaking: false
    integrated_skills: false
  incidental_context_allowed: true
  incidental_context_rule: El vocabulario y las oraciones contextuales pueden
           utilizarse para demostrar gramática, pero nunca deben convertirse en
           objetivos independientes de la lección.
level_model:
  type: continuum
  artificial_b1_b2_split: false
  progression:
    - recognition
    - form
    - meaning
    - use
    - contrast
    - constraints
    - exceptions
    - transformation
    - sentence_analysis
    - integration
    - structural_analysis
  structural_progression:
    - word
    - phrase
    - clause
    - sentence
  global_progression:
    A2: introduce and establish
    B1: consolidate and extend
    B2: contrast and use complex structures
    C1: advanced structures and exceptions
    C2: mastery, nuance and grammatical analysis
  avoid_repetition_without_new_depth: true
pedagogy:
  style: profundo, práctico, progresivo, contrastivo y orientado al dominio
      gramatical
  explanation_language: Spanish
  grammar_terminology: English
  examples_language: English
  indentation: false
  numbering: single-level
  explain_terminology: true
  contrastive_examples: true
  positive_and_negative_examples: true
  explain_form_meaning_relationship: true
  explain_constraints: true
  compare_alternative_constructions: true
  error_analysis: true
  structural_analysis: true
  teach_phrase_structure: true
  teach_clause_structure: true
  teach_grammatical_functions: true
  teach_complement_vs_adjunct: true
  teach_modifier_vs_complement: true
  teach_complementation: true
  teach_information_structure_at_b2: true
  require_natural_examples: true
  require_original_exercises: true
  avoid_unnecessary_repetition: true
lesson_structure:
  objective:
    required: true
    position: first
    heading: 🎯 OBJETIVO
  reading:
    required: true
    heading: 📚 LECTURA
    purpose: referencia bibliográfica gramatical; no actividad de
        comprensión lectora
    categories:
      - principal
      - supplementary
    exact_references_only_when_verified: true
  explanation:
    required: true
    heading: 📘 GRAMMAR
    requirements:
      - Explicar la estructura gramatical con precisión.
      - Distinguir forma, significado y uso.
      - Incluir afirmativa, negativa e interrogativa cuando corresponda.
      - Explicar auxiliares, orden y contracciones cuando sean relevantes.
      - Comparar estructuras que suelen confundirse.
      - Incluir excepciones y restricciones relevantes al nivel.
  examples:
    required: true
    heading: 💬 EXAMPLES
    requirements:
      - Usar ejemplos naturales en inglés.
      - Aumentar progresivamente la dificultad.
      - Incluir contrastes mínimos cuando sean útiles.
      - Incluir análisis o transformación cuando ayude a entender la regla.
  practice:
    required: true
    heading: 🧪 Laboratorio/ejemplos
    purpose: práctica gramatical, transformaciones, contrastes y análisis de
        forma, significado y uso
  common_errors:
    required: true
    heading: ⚠️ Errores frecuentes
  important_idea:
    required: false
    heading: 💡 Idea importante
  grammatical_analysis:
    required: false
    heading: 🔬 ANÁLISIS GRAMATICAL
    use_when:
      - sea útil identificar constituyentes y funciones
      - una transformación requiera explicar relaciones entre cláusulas
      - sea necesario justificar orden, complemento, adjunto o elección
        estructural
  remember:
    required: true
    position: last
    heading: 🧠 QUÉ DEBES RECORDAR
    min_items: 3
    max_items: 7
    avoid_repeating_objective: true
examples:
  target_language: English
  explanation_language: Spanish
  require_natural_examples: true
  allow_advanced_examples: false
  prefer_contrast_pairs: true
  mark_ungrammatical_examples: true
  ungrammatical_marker: '*'
  explain_acceptability: true
content_rules:
  grammar_only: true
  no_independent_vocabulary_lessons: true
  no_independent_pronunciation_lessons: true
  no_independent_reading_lessons: true
  no_independent_listening_lessons: true
  no_independent_writing_lessons: true
  no_independent_speaking_lessons: true
  no_generic_conversation_lessons: true
  no_exam_preparation_blocks: true
  no_independent_collocation_training: true
  include_common_errors: true
  include_exceptions_when_level_relevant: true
  include_sentence_analysis: true
  include_phrase_analysis: true
  include_clause_analysis: true
  include_word_phrase_clause_sentence_progression: true
  include_transformations: true
  include_consolidation_lessons: true
  include_checkpoints: true
  preserve_english_examples: true
references:
  principal:
    - author: Raymond Murphy
      title: English Grammar in Use
      edition: Fifth Edition
      role: principal pedagogical grammar and backbone
  citation_policy:
    exact_references_only_when_verified: true
    never_invent_page_numbers: true
    never_invent_unit_numbers: true
    distinguish_primary_from_supplementary: true
    paraphrase_sources: true
    do_not_copy_source_exercises: true
  supplementary:
    - author: Michael Swan
      title: Practical English Usage
      role: B1-B2 usage, contrast, exceptions and common learner problems
  reserved_for_c1_c2:
    - author: Ronald Carter; Michael McCarthy
      title: Cambridge Grammar of English
      role: advanced descriptive grammar reserved for the C1-C2 path
    - author: Rodney Huddleston; Geoffrey K. Pullum
      title: The Cambridge Grammar of the English Language
      role: advanced formal/descriptive reference reserved for C1-C2
          or expert analysis
  bibliography_policy:
    course_sources:
      - principal
      - supplementary
    web_reference_sites_as_course_bibliography: false
    rule: Cambridge Dictionary Grammar and British Council LearnEnglish
        Grammar are not course bibliography sources.
generation:
  lesson_depth: high
  standalone_lessons: true
  cumulative_progression: true
  avoid_unnecessary_repetition: true
  preserve_cross_references: true
  checkpoints:
    - A2 → B1 transition
    - B1 grammar
    - B2 grammar
    - Final B1 → B2 integration
  lesson_depth_rule: 'Profundidad alta dentro del nivel B1-B2: explicar forma,
      significado, uso, contraste, restricciones, excepciones relevantes,
      transformaciones y análisis estructural, sin convertir la lección en
      gramática avanzada C1-C2.'
  respect_c1_c2_boundary: true
quality_checks:
  require_objective_first: true
  require_remember_last: true
  verify_lesson_is_grammar_focused: true
  verify_examples_support_grammar_target: true
  verify_terminology_is_explained: true
  verify_contrasts_are_semantically_accurate: true
  verify_no_skill_block_drift: true
  verify_no_unverified_exact_bibliographic_reference: true
  verify_level_boundaries: true
  verify_b2_depth_without_c1_c2_drift: true
  verify_advanced_reference_not_used_as_b2_backbone: true
  verify_structural_analysis_remains_level_appropriate: true
level_specific:
  boundaries:
    from: B1
    to: B2
    rule: Consolidar estructuras introducidas en A2 solo cuando exista nueva
        profundidad, contraste, restricción, excepción o integración propia
        de B1-B2. En B2 se permite análisis de word, phrase, clause, sentence,
        constituent, head, modifier, complement, adjunct y funciones
        gramaticales cuando apoye la comprensión; no desarrollar como objetivo
        central la gramática avanzada reservada para C1-C2.
  required_topics:
    contrastive_teaching: true
    exceptions_when_level_relevant: true
    sentence_analysis: true
    transformations: true
    consolidation: true
    phrase_and_clause_structure: true
    grammatical_functions: true
    complementation_and_modification: true
    information_structure_introduction: true
  c1_c2_boundary:
    introduce_but_do_not_exhaust:
      - conditional_inversion
      - negative_inversion
      - fronting
      - clefts
      - extraposition
      - structural_ambiguity
    reserve_deep_mastery_for_c1_c2:
      - advanced_inversion
      - advanced_information_packaging
      - advanced_nominalisation
      - advanced_complementation
      - advanced_discourse_grammar
      - marked_word_order
    policy: Los contenidos puente pueden introducirse de forma limitada en B2,
        pero su análisis sistemático, excepciones avanzadas, variación
        discursiva y dominio formal pertenecen al path C1-C2.
    do_not_use_as_b2_core_references:
      - Cambridge Grammar of English — Carter & McCarthy
      - The Cambridge Grammar of the English Language — Huddleston & Pullum

progression_rules:
  structural_foundations:
    first_introduction: block_0
    local_refresh_before_use: true
    final_synthesis: block_40
    rule: Introducir forma y función antes del análisis avanzado; recuperar
      cada término al utilizarlo y reservar el bloque 40 para integración.
  analytical_framework:
    distinguish_category_from_function: true
    distinguish_required_adverbial_from_optional_adjunct: true
    explain_vp_convention_before_analysis: true
    use_consistent_terminology: true
    rule: En SVA y SVOA, A puede representar un complemento adverbial exigido
      por el verbo; no identificar automáticamente A con adjunto opcional.
  repeated_topics:
    require_distinct_learning_objective: true
    require_new_contrast_constraint_or_integration: true
    avoid_reusing_same_exercises: true
  checkpoint_26:
    purpose: B1 core diagnostic with separately labelled extension review
    assess_core_and_extensions_separately: true
    do_not_require_b2_extensions_for_b1_pass: true
    rule: El alcance del diagnóstico B1 se define por objetivos y ejemplos,
      no por asumir que toda lección anterior es requisito obligatorio B1.
