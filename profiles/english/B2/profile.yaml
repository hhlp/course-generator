  teaching_rules:
    - Inventario pedagógico amplio, no lista oficial exhaustiva
      del CEFR. Las etiquetas B1/B2 son orientativas y dependen
      del uso y la estructura.
    - Distinguir coordinator, subordinator, linking adverb, prepositional
      expression y discourse marker; no llamar conjunción a toda
      expresión.
    - En cada familia explicar significado, complemento, posición,
      puntuación, registro, alcance, restricciones, errores y
      transformaciones originales.
    - Admitir más de una función por expresión. Separar los sentidos
      de as, since, while, so, still, yet, besides, otherwise
      y apart from.
    - Enseñar paralelismo en correlativas y concordancia con ejemplos
      claros. No convertir not only inicial con inversión en objetivo
      central B2.
    - Distinguir hecho y condición en even though/even if; precaución
      y condición en in case/if; finalidad y resultado en so that/so.
    - 'Distinguir oposición de perspectivas y refutación: on the
      other hand frente a on the contrary. Actually no equivale
      a actualmente.'
    - Contrastar although + clause con despite + noun/-ing y con
      despite the fact that + clause; because frente a because
      of.
    - 'Explicar la unión entre oraciones independientes con however/therefore:
      punto o punto y coma; evitar comma splices en los modelos
      escritos.'
    - En cláusulas temporales futuras enseñar presente simple
      o perfecto según el significado; distinguirlas de preguntas
      indirectas con will.
    - Separar so ... that y such ... that de finalidad; diferenciar
      función for + -ing e intención to + infinitive, sin generalizar
      for a toda finalidad.
    - Los marcadores discursivos se analizan por posición, alcance
      y relación entre enunciados, sin crear bloques de conversación,
      escritura o léxico.
    - Las variantes formales menos frecuentes se trabajan como
      ampliación B2 y reconocimiento; no son requisitos automáticos
      del checkpoint B1.
    - 'Bloque 13: finalidad; 22: fundamentos; 29: condiciones;
      37: contraste e integración; 41: diagnóstico final. Evitar
      repetir el mismo objetivo.'
