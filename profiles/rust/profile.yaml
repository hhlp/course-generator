course:
  title: Rust 0 → Experto en Profundidad
  language: es
  level:
    start: beginner
    end: expert
  primary_platform: Fedora Linux
  focus:
  - language_fundamentals
  - ownership
  - borrowing
  - lifetimes
  - traits
  - generics
  - type_system
  - concurrency
  - atomics
  - async
  - systems_programming
  - unsafe
  - ffi
  - performance
  - compiler_internals
  - professional_rust
  - regex_integration
  - big_o_application
  - cli_application_development
  - terminal_user_interfaces
  - fedora_rpm_distribution
files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md
toolchain:
  default_channel: stable
  package_manager: cargo
  components:
  - rustc
  - cargo
  - rustfmt
  - clippy
  - rustdoc
  - rust-analyzer
  nightly_policy: Usar sólo cuando el contenido lo requiera explícitamente.
pedagogy:
  approach: theory_to_practice
  explain_mental_models: true
  compiler_diagnostics: true
  progressive_examples: true
  laboratories: true
  progressive_projects: true
  final_project: true
  safe_rust_first: true
  performance_requires_measurement: true
  regex_theory_external_path: true
  regex_rust_usage_in_depth: true
  big_o_theory_external_path: true
  big_o_rust_application_in_depth: true
  cli_development_in_depth: true
  cli_tui_progressive_labs: true
  cli_cross_reference_existing_blocks: true
lesson_template:
- 🎯 OBJETIVO
- Teoría y modelo mental
- Sintaxis / anatomía
- Ejemplos progresivos
- 🧪 Laboratorio
- ⚠️ Errores frecuentes
- 💡 Idea importante
- 📚 LECTURA
- 🧠 QUÉ DEBES RECORDAR
sources:
  official_docs: primary
  books: primary_and_supplementary
  reference_semantics: official_rust_reference
  unsafe_reference: rustonomicon
  compiler_reference: rustc_dev_guide
quality:
  require_compilable_examples: true
  distinguish_safe_and_unsafe: true
  explain_tradeoffs: true
  include_testing: true
  include_debugging: true
  include_security: true
  include_performance: true
  include_reading_references: true
  regex_policy:
    teach_regex_theory: false
    teach_rust_api_and_integration: true
    require_compilable_examples: true
    cover_unicode_and_bytes: true
    cover_performance_and_security: true
  big_o_policy:
    teach_big_o_theory: false
    teach_rust_application_and_analysis: true
    analyze_std_collections_and_iterators: true
    cover_time_and_space_complexity: true
    distinguish_asymptotics_from_measured_performance: true
    require_benchmarks_and_profiling_for_optimization: true
  cli_policy:
    platform: Fedora Linux
    require_arg_parsing_and_unix_io: true
    cover_clap_and_ratatui: true
    cover_non_tty_and_exit_codes: true
    cover_config_errors_signals_and_security: true
    require_integration_and_e2e_tests: true
    require_completions_manpages_rpm_and_ci: true
    avoid_duplicate_cargo_regex_big_o_theory: true
    require_progressive_cli_projects: true
