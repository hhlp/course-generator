---
course:
  title: "Regex — 0 a Experto en Profundidad"
  language: "es"
  level:
    start: "cero"
    end: "experto"
  platform:
    - Fedora
    - Linux
    - RHEL
  mode: "deep"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  required_opening: "🎯 OBJETIVO"
  required_closing: "🧠 QUÉ DEBES RECORDAR"
  remember_min_items: 3
  remember_max_items: 7
  optional_sections:
    - "🧪 Laboratorio/ejemplos"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
  style:
    - profundo
    - didactico
    - autocontenido
    - progresivo
    - orientado_a_comprension
    - no_resumen_superficial

scope:
  programming_languages: false
  windows: false
  base_language_agnostic: true
  preferred_environment: Fedora Linux

regex_policy:
  distinguish_dialect_specific_features: true
  distinguish_engine_specific_behavior: true
  prefer_language_agnostic_examples: true
  programming_language_examples: false
  explain_consumption_vs_assertion: true
  require_engine_or_dialect_label_when_nonportable: true
  require_positive_and_negative_examples_when_useful: true
  require_performance_security_notes_when_relevant: true
  require_operation_contract: true
  require_explicit_offset_unit: true
  require_empty_match_progress_policy: true
  require_semantics_preserving_optimization_checks: true
  distinguish_selection_semantics_from_execution: true
  distinguish_utf_from_unicode_properties: true
  distinguish_heuristics_from_security_guarantees: true

lesson_structure:
  objective:
    required: true
    position: first

  reading:
    required: true
    categories:
      - principal
      - normativa
      - motor
      - profundizacion
      - consulta
    exact_references_only_when_verified: true

  lab:
    required: false

  common_errors:
    required: false

  important_idea:
    required: false

  remember:
    required: true
    position: last
    min_items: 3
    max_items: 7

quality:
  forbid_generic_scaffold: true
  require_topic_specific_headings: true
  require_topic_specific_examples: true
  require_self_contained_lesson: true
  audit_before_save: true
  repair_on_fail: true

output:
  format: markdown
  zip_block: true
  write_index: true
  write_manifest: true

artifacts:
  enabled: true
  default_strategy: auto
  overrides: {}

  project_policy:
    integrator_projects: auto
    diagnostic_projects: auto
    require_project_for_every_block: false

validation:
  enabled: false
  commands: []

# Content guidance; automatic enforcement depends on course-generator.
project_scope:
  required_deliverable: conceptual_analysis_dossier
  executable_implementation: optional_in_separate_programming_path
  supported_syntax: explicitly_declared_subset
  unknown_syntax: report_as_unsupported
  redos_analysis: justified_heuristics
  required_evidence:
    - specification_and_operation
    - manually_constructed_ast
    - positive_negative_and_boundary_corpus
    - expected_and_observed_results
    - engine_version_flags_and_relevant_locale
    - explicit_offsets_and_empty_match_policy
    - portability_performance_and_limitations

curriculum_policy:
  preserve_original_lesson_ids: true
  preserve_blocks_0_to_48: true
  introduce_minimum_prerequisites_before_use: true
  block_43_role: intermediate_integrator
  block_48_role: expert_capstone
