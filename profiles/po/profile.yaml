---
course:
  title: Professional Product Owner — 0 a experto en Profundidad
  language: es
  level:
    start: cero
    end: experto
  mode: deep

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  style: profundo, práctico, progresivo y orientado a producto real
  lesson_structure:
    required_opening: 🎯 OBJETIVO
    required_closing: 🧠 QUÉ DEBES RECORDAR
    optional_sections:
      - 📚 LECTURA
      - 🧪 Laboratorio/ejemplos
      - ⚠️ Errores frecuentes
      - 💡 Idea importante
  closing_requirements:
    min_points: 3
    max_points: 7
    avoid_repeating_objective: true
  indentation: false
  numbering: single-level

lesson_structure:
  objective:
    required: true
    position: first
    heading: 🎯 OBJETIVO
  reading:
    required: true
    heading: 📚 LECTURA
    categories:
      - principal
      - normativa
      - product_backlog
      - discovery
      - estrategia
      - metricas
      - profundizacion
      - consulta
    exact_references_only_when_verified: true
  lab:
    required: false
    heading: 🧪 Laboratorio/ejemplos
    required_for_explicit_lab_lessons: true
    required_for_capstone: true
  practical_application:
    required: true
    format: ejercicio breve, decisión justificada o artefacto revisable
    evaluation_criteria_required: true
  common_errors:
    required: false
    heading: ⚠️ Errores frecuentes
  important_idea:
    required: false
    heading: 💡 Idea importante
  remember:
    required: true
    position: last
    heading: 🧠 QUÉ DEBES RECORDAR
    min_items: 3
    max_items: 7
course_focus:
  - product ownership
  - product value
  - product vision
  - product strategy
  - product goals
  - product backlog
  - product backlog refinement
  - ordering
  - product discovery
  - stakeholders
  - metrics
  - evidence-based management
  - product economics
  - flow
  - flow metrics
  - scrum charts interpretation
  - probabilistic forecasting
  - forecasting
constraints:
  avoid_scrum_path_duplication: true
  scrum_topics_are_contextualized_for_product_owner: true
  flow_mechanics_are_not_duplicated_from_scrum_kanban_path: true
  charts_must_explain_data_origin_and_product_owner_interpretation: true
  metrics_must_not_be_used_for_individual_productivity: true
  emphasize_outcomes_over_outputs: true
  product_backlog_is_not_a_requirements_document: true
  refinement_is_continuous_activity_not_scrum_event: true

milestones:
  - id: pspo-i
    after_block: 11
    name: Professional Scrum Product Owner I
  - id: pspo-ii
    after_block: 20
    name: Professional Scrum Product Owner II
  - id: pspo-iii
    after_block: 23
    name: Professional Scrum Product Owner III
  - id: expert-project
    after_block: 24
    name: Product Owner Expert — Proyecto final

depth_requirements:
  progression:
    - fundamentos
    - aplicación
    - análisis de escenarios
    - decisiones complejas
    - dominio experto
  every_lesson:
    - explicación conceptual rigurosa
    - ejemplos contextualizados en productos reales
    - trade-offs, límites y anti-patrones
    - aplicación práctica y criterios para evaluar resultados
  labs: casos y artefactos de producto progresivos; ejercicios de toma de
      decisiones y defensa de alternativas
  assessment: evaluaciones por hito PSPO I, II y III; casos situacionales sin
      prometer equivalencia al examen oficial
  capstone: entregables trazables, criterios de aceptación, evidencia, defensa
      de decisiones y retrospectiva de aprendizaje

refinement_depth:
  focus_block: 9
  preserve_existing_lessons: true
  required_topics:
    - preparación y selección de PBIs según Product Goal
    - facilitación paso a paso y seguimiento de decisiones
    - evidencia de discovery, feedback e hipótesis
    - descomposición progresiva y slicing vertical
    - incertidumbre, flujo y forecasting sin garantías
    - colaboración entre equipos sobre un Product Backlog único
    - evaluación de efectividad sin métricas de productividad individual
  required_lab_outputs:
    - contexto y objetivo del refinement
    - PBIs antes y después con criterios de aceptación cuando proceda
    - registro de incertidumbres, dependencias y decisiones
    - justificación del orden y próximos pasos
    - retrospectiva de efectividad del refinement
  constraints:
    refinement_is_not_a_formal_scrum_event: true
    definition_of_ready_is_optional: true
    developers_are_responsible_for_sizing: true
    product_owner_is_accountable_for_backlog_ordering: true
    avoid_repeating_scrum_and_kanban_mechanics: true

review_requirements:
  user_stories:
    express_needs_and_support_requirements_conversations: true
    not_a_mandatory_format_for_all_pbis: true
  sprint_changes:
    product_owner_must_not_add_sprint_work_unilaterally: true
    developers_adapt_sprint_backlog: true
    scope_negotiated_with_product_owner: true
    protect_sprint_goal_and_quality: true
    include_bug_and_hotfix_case: true
    only_product_owner_can_cancel_sprint: true
  pspo_i_bridge:
    before_checkpoint: true
    block: 11
    topics:
      - empirismo, valores y accountabilities
      - eventos, artefactos y compromisos
      - autogestión, Sprint Goal y Definition of Done
      - releases, Sprint Review y límites del forecast
    reuse_scrum_path_evidence_when_available: true
  lifecycle:
    - lanzamiento y criterios de éxito
    - adopción, soporte y evolución
    - retirada, comunicación, migración y datos
  experimentation:
    - hipótesis, muestra, duración y regla de decisión
    - sesgos, causalidad e incertidumbre
    - métricas de protección y efectos no deseados
    - resultados negativos e inconcluyentes
  littles_law:
    - límites del sistema y conservación del trabajo
    - promedios de largo plazo y unidades compatibles
    - estabilidad, ventanas de observación y cambios de flujo
    - ausencia de garantías de plazo para elementos individuales
