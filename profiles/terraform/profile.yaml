---
course:
  title: TERRAFORM EN PROFUNDIDAD — LEARNING PATH 0 → EXPERTO
  language: es
  level:
    start: cero
    end: experto
  platform:
    - Fedora
    - RHEL
    - Linux
  mode: deep
  milestones:
    - id: terraform-foundations
      after_block: 5
      name: Terraform Foundations — CLI, HCL y providers
    - id: terraform-associate
      after_block: 13
      name: Terraform Associate — preparación conceptual y práctica; verificar
        objetivos vigentes
    - id: terraform-advanced
      after_block: 21
      name: Terraform Advanced — operación, seguridad e internals
    - id: terraform-expert
      after_block: 29
      name: Terraform Expert — arquitectura, recuperación y on-premises

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

lesson_structure:
  objective:
    required: true
    position: first
  reading:
    required: true
  lab:
    required: true
  common_errors:
    required: true
  important_idea:
    required: true
  remember:
    required: true
    position: last
    min_items: 3
    max_items: 7

quality:
  forbid_generic_scaffold: true
  require_topic_specific_headings: true
  require_topic_specific_examples: true
  require_self_contained_lesson: true
  distinguish_core_from_provider_behavior: true
  verify_version_sensitive_features: true
  require_cli_command_context: true
  distinguish_interactive_from_automation_cli: true
  mark_legacy_or_deprecated_cli_commands: true
  audit_before_save: true
  repair_on_fail: true
  require_expected_lab_results: true
  require_troubleshooting_scenarios: true
  require_safe_recovery_guidance: true
  require_security_considerations: true
  require_version_compatibility_notes: true
  require_core_provider_opentofu_distinction: true
  require_on_premises_examples: true
  preserve_existing_lessons: true

output:
  format: markdown
  zip_block: true
  write_index: true
  write_manifest: true

artifacts:
  enabled: true
  default_strategy: auto
  overrides:
    '24.21':
      strategy: standalone_project
      project_id: terraform-production-platform
      knowledge_dependencies:
        - bloque-0
        - bloque-1
        - bloque-2
        - bloque-3
        - bloque-4
        - bloque-5
        - bloque-6
        - bloque-7
        - bloque-8
        - bloque-9
        - bloque-10
        - bloque-11
        - bloque-12
        - bloque-13
        - bloque-14
        - bloque-15
        - bloque-16
        - bloque-17
        - bloque-18
        - bloque-19
        - bloque-20
        - bloque-21
        - bloque-22
        - bloque-23
      artifact_dependencies: []
      required_files:
        - README.md
        - versions.tf
        - providers.tf
        - variables.tf
        - main.tf
        - outputs.tf
        - modules/README.md
        - ansible/README.md
        - .gitignore
      validation_required: true
      project_type: integrator
  project_policy:
    integrator_projects: auto
    diagnostic_projects: auto
    require_project_for_every_block: false

validation:
  enabled: true
  commands:
    - terraform fmt -check -recursive
    - terraform init -backend=false
    - terraform validate
  notes: terraform validate requiere inicialización y dependencias instaladas;
    ejecutar tests y plan solo con fixtures/credenciales apropiadas y sin
    recursos reales no autorizados.
