---
course:
  title: TERRAFORM EN PROFUNDIDAD — LEARNING PATH 0 → EXPERTO
  language: es
  level:
    start: cero
    end: experto
  platform:
    - Fedora
    - RHEL
    - Linux
  mode: deep
  milestones:
    - id: terraform-foundations
      after_block: 5
      name: 'Fundamentos: CLI inicial, HCL y providers'
    - id: terraform-operations
      after_block: 15
      name: 'Checkpoint operativo: state, módulos, seguridad y CI/CD'
    - id: terraform-advanced
      after_block: 21
      name: 'Nivel avanzado: operación y comparación de ecosistemas'
    - id: terraform-expert
      after_block: 29
      name: Defensa experta del itinerario y recuperación demostrada
files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md
lesson_structure:
  objective:
    required: true
    position: first
  reading:
    required: true
  lab:
    required: true
  common_errors:
    required: true
  important_idea:
    required: true
  remember:
    required: true
    position: last
    min_items: 3
    max_items: 7
quality:
  forbid_generic_scaffold: true
  require_topic_specific_headings: true
  require_topic_specific_examples: true
  require_self_contained_lesson: true
  distinguish_core_from_provider_behavior: true
  verify_version_sensitive_features: true
  require_cli_command_context: true
  distinguish_interactive_from_automation_cli: true
  mark_legacy_or_deprecated_cli_commands: true
  audit_before_save: true
  repair_on_fail: true
  require_expected_lab_results: true
  require_troubleshooting_scenarios: true
  require_safe_recovery_guidance: true
  require_security_considerations: true
  require_version_compatibility_notes: true
  require_core_provider_opentofu_distinction: true
  require_on_premises_examples: true
  preserve_existing_lessons: true
