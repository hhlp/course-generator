validation:
  enabled: true
  commands:
    - terraform fmt -check -recursive
    - terraform init -backend=false -input=false
    - terraform validate
  notes: Aplicar a root modules .tf y fixtures en su directorio. init
    puede descargar dependencias; usar código confiable. validate no
    verifica APIs. Go y Stacks requieren validación propia. Plan y
    test solo en entornos aislados con credenciales apropiadas. Ver
    rutas y progresión en domain.md.
