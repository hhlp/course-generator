---
course:
  title: IP Addressing + Subnetting + VLSM — 0 a Experto
  language: "es"
  level:
    start: "cero"
    end: "experto"
  platform:
    primary:
      - Fedora
      - RHEL
    concepts: vendor-neutral
  mode: "deep"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

objectives:
  - dominar IPv4 e IPv6 desde su representación binaria y hexadecimal
  - calcular red, subred, broadcast, rangos y prefijos manualmente
  - dominar CIDR, FLSM, VLSM, supernetting y route summarization
  - diseñar planes de direccionamiento IPv4/IPv6 escalables
  - implementar y verificar direccionamiento en Linux
  - automatizar cálculos con Python ipaddress
  - diagnosticar problemas de direccionamiento y solapamiento

focus:
  - IPv4
  - IPv6
  - classful_addressing_history
  - CIDR
  - subnetting
  - FLSM
  - VLSM
  - supernetting
  - route_summarization
  - dual_stack
  - IPAM
  - Linux_networking
  - troubleshooting

lesson_style:
  start_with: 🎯 OBJETIVO
  end_with: 🧠 QUÉ DEBES RECORDAR
  optional_sections:
    - 🧪 Laboratorio/ejemplos
    - ⚠️ Errores frecuentes
    - 💡 Idea importante
  requirements:
    - explicar primero el razonamiento y después los atajos de cálculo
    - mostrar binario en los temas de subnetting donde aporte comprensión
    - incluir ejercicios manuales antes de automatizar
    - usar ejemplos IPv4 e IPv6 progresivos
    - incluir comandos reales de Fedora/RHEL en los laboratorios Linux
    - incluir troubleshooting en los bloques prácticos
    - tratar clases A/B/C/D/E como contexto histórico, no como diseño moderno
    - utilizar CIDR como modelo moderno de direccionamiento
    - separar pertenencia matemática, alcance on-link y selección de ruta
    - explicar RA y flags L/A sin duplicar el PATH de protocolos
    - distinguir broadcast IPv4 de límites numéricos IPv6 en ipaddress
    - procesar prefijos IPv6 sin enumerar espacios de hosts masivos
    - comprobar conflictos por VRF y familia con contención válida
    - distinguir fusión de bloques hermanos de resumen de conjuntos

labs:
  enabled: true
  environment: Fedora/RHEL
  tools:
    - ip
    - nmcli
    - ping
    - tracepath
    - traceroute
    - ipcalc
    - tcpdump
    - tshark
    - ss
    - journalctl
    - python

final_project:
