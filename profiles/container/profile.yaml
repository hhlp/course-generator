teaching_rules:
  - Explicar primero el concepto común y después cómo lo implementan Podman,
    Docker, Buildah y Skopeo.
  - 'No presentar Podman y Docker como tecnologías completamente separadas:
    comparten el modelo OCI y gran parte de la experiencia de usuario.'
  - Distinguir con precisión imagen, contenedor, runtime, engine, registry,
    repository, tag y digest.
  - Explicar Buildah como herramienta especializada en construcción y
    manipulación de imágenes.
  - Explicar Skopeo como herramienta especializada en inspección, copia,
    sincronización y transporte de imágenes sin ejecutar contenedores.
  - Relacionar Podman, Buildah y Skopeo con containers/image y
    containers/storage cuando corresponda.
  - 'Explicar la arquitectura Docker: Docker CLI, dockerd, containerd
    y runc cuando sea relevante.'
  - Priorizar rootless Podman en Fedora, sin omitir rootful.
  - Tratar SELinux como parte normal del funcionamiento de contenedores en
    Fedora, no como un apéndice.
  - Usar cgroups v2 como modelo principal.
  - Incluir comandos reales, inspección y diagnóstico.
  - Comparar comandos equivalentes Podman/Docker cuando ayude al aprendizaje.
  - Mostrar también los casos donde la compatibilidad Podman/Docker
    no es idéntica.
  - Diferenciar Containerfile y Dockerfile a nivel de compatibilidad
    y ecosistema.
  - Usar digests para explicar identidad inmutable de imágenes.
  - Cubrir imágenes multi-arquitectura, manifests e índices OCI.
  - Cubrir systemd y Quadlet como integración de producción en Fedora.
  - Relacionar el PATH con Kubernetes únicamente como puente conceptual;
    Kubernetes profundo pertenece a su propio PATH.
  - Cada laboratorio debe reforzar directamente los conceptos de la lección.
  - 'En troubleshooting, seguir una metodología reproducible: síntoma →
    capa → evidencia → hipótesis → prueba → corrección.'

