project_acceptance:
  milestone_39:
    - Detectar engine y contexto; emitir JSON válido e informe humano.
    - Correlacionar contenedor, PID, namespaces, cgroup, mounts y red.
    - Redactar secretos y distinguir permiso insuficiente de recurso ausente.
  milestone_52:
    - Mantener el contrato base y los adaptadores Podman/Docker.
    - Correlacionar build, digest, plataforma, registry y despliegue.
    - Diagnosticar fallos inyectados y verificar restauración de datos.
    - Entregar pruebas, evidencias sanitizadas y runbook reproducible.
  milestone_61:
    - Inventariar nodos, servicios, tareas, stacks y redes de Swarm.
    - Distinguir datos locales, datos de manager y evidencias no disponibles.
    - Evaluar salud y quorum observado sin afirmar certeza sin evidencias.
    - Probar incidentes de tareas, red, managers, rollback y restauración.
    - Conservar compatibilidad JSON y no revelar secrets ni join tokens.

