purpose: Crear un recorrido completo y progresivo desde los fundamentos de los
  contenedores Linux hasta la administración, construcción, transporte,
  seguridad, automatización, troubleshooting e internals de Podman, Docker,
  Buildah y Skopeo. El curso debe enseñar primero el modelo común que comparten
  las herramientas —Linux, OCI, imágenes, layers, registries, storage,
  networking y runtimes— y después las responsabilidades y diferencias de cada
  componente.
  La ampliación experta incorpora los bloques 40–52 conservando íntegros
  los bloques 0–39. Docker Swarm ocupa los bloques 53–61; los hitos
  incrementales del proyecto son 39, 52 y 61.

