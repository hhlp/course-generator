---
course:
  title: Java — 0 a Experto en Profundidad
  language: es
  level:
    start: cero
    end: experto
  primary_book:
    title: Core Java, Volumes I & II
    edition: 14th
    author: Cay S. Horstmann
  mode: deep
files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md
learner:
  assumed_knowledge:
    - Ningún conocimiento previo de Java
    - Conocimientos generales de informática son útiles pero no obligatorios
  goals:
    - Dominar Java moderno
    - Comprender la JVM y no únicamente la sintaxis
    - Programar aplicaciones concurrentes y asíncronas correctamente
    - Trabajar con bases de datos mediante JDBC
    - Construir interfaces desktop con JavaFX
    - Comprender AWT/Swing y el modelo gráfico/eventos de Java SE
    - Trabajar con XML e internacionalización
    - Aplicar expresiones regulares desde Java mediante Pattern, Matcher,
      String y Streams sin duplicar el PATH Regex
    - Aplicar Big-O al código, Collections, Streams y decisiones de
      rendimiento Java sin duplicar el PATH Big-O
    - Comprender interoperabilidad nativa mediante FFM
    - Diagnosticar y optimizar aplicaciones Java
environment:
  os_focus:
    - Linux
  runtime:
    - OpenJDK 25
  database:
    - PostgreSQL
  gui:
    - JavaFX
  build_tools:
    - Maven
    - Gradle
  testing:
    - JUnit
    - Mockito
    - Testcontainers
  version_policy:
    - Base Java SE 25; registrar distribución y actualización exacta
      del JDK
    - Compilar con release 25; preview aislada con JDK 25 en compile
      y runtime
    - Fijar wrappers, plugins y dependencias compatibles en cada laboratorio
    - Registrar versiones exactas; evitar latest, rangos y versiones
      dinámicas
    - JavaFX es externo; Testcontainers necesita runtime OCI compatible
lesson_style:
  opening: 🎯 OBJETIVO
  closing: 🧠 QUÉ DEBES RECORDAR
  preferred_sections:
    - Explicación conceptual
    - Sintaxis y anatomía
    - Ejemplos ejecutables
    - 🧪 Laboratorio
    - ⚠️ Errores frecuentes
    - 💡 Idea importante
    - 📚 LECTURA
    - Referencias
  code_requirements:
    - Código completo cuando sea necesario para comprender el ejemplo
    - Explicar la salida esperada
    - Mostrar variantes correctas e incorrectas cuando aporten valor
    - Usar CLI del JDK cuando ayude a comprender el mecanismo interno
    - Declarar prerrequisitos concretos y completar laboratorios por
      etapas
    - Proporcionar build mínimo, comandos, salida y limpieza de recursos
    - Citar API/JLS/JVMS de JDK 25 y distinguir contrato de implementación
    - Introducir pruebas desde el bloque 0 y casos de frontera desde
      1–2
  depth:
    - Explicar qué
    - Explicar cómo
    - Explicar por qué
    - Explicar cuándo usarlo
    - Explicar cuándo no usarlo
    - Explicar costes y trade-offs
progression:
  approach: teoría + ejemplo + laboratorio + proyecto incremental
  projects:
    - Aplicación CLI orientada a objetos
    - Procesador de datos funcional con Streams
    - Aplicación concurrente/asíncrona
    - Aplicación JavaFX + PostgreSQL
    - Refactor arquitectónico
    - Proyecto final integrado
  study_route:
    - Wrappers en 4 antes de 10–11; consolidación numérica en 17
    - 'EnumSet/EnumMap: introducción en 8.3 y desarrollo en 11'
    - Bloque 12 por etapas según la ruta anotada de initial.txt
    - Streams en 12 tras 15; I/O tras 19; JDBC tras 32; concurrencia
      tras 29
    - JMH de 11–12 tras 45; memoria y costes JVM después de 41–45
    - Networking síncrono en 20; TCP concurrente tras 26; HTTP async
      tras 27
    - Reflection en 21 y laboratorio con anotaciones tras 22
    - Testing desde 0; 35 consolida la suite de los proyectos
    - Build mínimo desde 0; Maven/Gradle profundos en 37–38
    - Entrega base en 54; integración y defensa final después de 60
special_focus:
  - Generics y Collections en profundidad
  - 'Big-O aplicado a Java: análisis de código, APIs y estructuras
    sin reenseñar el PATH Big-O'
  - Programación funcional
  - Integración y uso de regex desde Java (Pattern/Matcher/String/Streams)
  - Concurrencia y multihilo
  - Java Memory Model
  - Programación asíncrona
  - Virtual threads
  - JDBC y bases de datos
  - JavaFX
  - JVM, bytecode, GC y JIT
  - Performance y profiling
  - Troubleshooting
  - XML y procesamiento seguro
  - Internacionalización (i18n)
  - Compiler API y scripting
  - AWT, Swing y Graphics2D
  - Foreign Function & Memory API (FFM)
constraints:
  - No depender de un IDE para enseñar los fundamentos
  - No introducir ORM antes de JDBC
  - No introducir abstracciones concurrentes avanzadas sin explicar
    threads y JMM
  - Distinguir APIs estables, preview e incubator según el JDK objetivo
  - No optimizar sin medición
  - 'No reenseñar Regex en el PATH Java: la teoría y sintaxis pertenecen
    al PATH Regex; aquí se estudia su aplicación e integración en
    Java'
  - 'No reenseñar Big-O en el PATH Java: la teoría general pertenece
    al PATH Big-O; aquí se estudia su aplicación al código, APIs,
    Collections, Streams y rendimiento Java'
  - Mantener los 61 bloques y los IDs originales; añadir al final
    de cada bloque
  - Respetar la ruta por etapas; no exigir APIs antes de sus prerrequisitos
  - ScopedValue es final en 25; Structured Concurrency es quinta preview
    en 25
  - No presentar synchronized como causa general de pinning desde
    JDK 24
  - No afirmar cobertura capítulo por capítulo sin una matriz contrastada
  - Los campos docentes no implican nuevas opciones del generador
assessment:
  criteria:
    - Compilar y pasar pruebas en la plataforma declarada
    - Cubrir contratos, entradas inválidas y casos de frontera
    - Demostrar cierre de recursos y cancelación cooperativa
    - Justificar decisiones con contratos y mediciones pertinentes
    - Reproducir y diagnosticar un fallo con evidencias
  concurrency:
    - Coordinar tareas explícitamente; sleep no demuestra corrección
    - Limitar tiempos de prueba y limpiar tareas incluso ante fallos
  final_project:
    - Entregar manifiesto, instrucciones, pruebas e informe de diagnóstico
    - Integrar 55–60 según requisitos; no forzar FFM sin necesidad
