name: pandas
title: "Pandas 3 en profundidad"
description: "Learning path 0 → experto para pandas 3.x: Series, DataFrame, Index, dtypes, missing data, GroupBy, reshaping, time series, I/O, rendimiento, Copy-on-Write, PyArrow, testing, internals y arquitectura profesional."
language: es

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliografy.md

course:
  path: initial.txt
  level_start: "cero"
  level_end: "experto"
  platform: "Python + pandas 3.x"
  style: "profundo, progresivo, práctico y técnico"

pedagogy:
  objective_first: true
  remember_last: true
  examples: true
  labs: true
  common_errors: true
  important_ideas: true
  remember_items_min: 3
  remember_items_max: 7

technical_focus:
  - Series
  - DataFrame
  - Index
  - MultiIndex
  - dtypes
  - nullable dtypes
  - missing data
  - strings
  - merge and joins
  - reshaping
  - GroupBy
  - rolling and windows
  - time series
  - I/O
  - SQL
  - Parquet
  - PyArrow
  - method chaining
  - Copy-on-Write
  - performance
  - memory optimization
  - testing
  - troubleshooting
  - internals
  - extensibility

version_policy:
  target: "pandas 3.x"
  official_docs_authoritative: true
  explain_migrations_from_2x: true
  avoid_deprecated_apis: true
