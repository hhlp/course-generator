course:
  id: pandas3
  title: "Pandas 3 — Learning Path 0 → Experto"
  language: es
  target_version: "Pandas 3.x"
  blocks: 18
  lessons: 216

pedagogy:
  style: "profundo, práctico, progresivo y orientado a datos reales"
  indentation: false
  numbering: single-level
  lesson_structure:
    objective:
      required: true
      position: first
      heading: "🎯 OBJETIVO"
    reading:
      required: true
      heading: "📚 LECTURA"
      categories:
        - principal
        - normativa
        - patrones
        - profundizacion
        - consulta
      exact_references_only_when_verified: true
    lab:
      required: false
      heading: "🧪 Laboratorio/ejemplos"
    common_errors:
      required: false
      heading: "⚠️ Errores frecuentes"
    important_idea:
      required: false
      heading: "💡 Idea importante"
    remember:
      required: true
      position: last
      heading: "🧠 QUÉ DEBES RECORDAR"
      min_items: 3
      max_items: 7
      avoid_repeating_objective: true

sources:
  precedence:
    - "Documentación oficial de pandas 3.x para API y comportamiento vigente"
    - "Pandas for Everyone, Second Edition — Daniel Y. Chen"
    - "Effective Pandas: Patterns for Data Manipulation — Matt Harrison"
    - "Pandas in Action — Boris Paskhaver"
  official_docs_override_older_book_behavior: true

pandas3:
  copy_on_write: required
  modern_dtypes: required
  chained_assignment:
    teach: true
    recommend: false
  vectorization: preferred_when_appropriate
  method_chaining: teach
  migration_from_older_pandas: required

content_rules:
  preserve_path_structure: true
  one_lesson_per_line_in_initial: true
  use_realistic_datasets: true
  compare_idiomatic_and_non_idiomatic_patterns: true
  avoid_unverified_page_or_chapter_references: true
