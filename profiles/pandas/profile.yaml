name: pandas
title: "Pandas 3 en profundidad"
description: "Learning path 0 → experto para pandas 3.x: Series, DataFrame, Index, dtypes, missing data, GroupBy, reshaping, time series, I/O, rendimiento, Copy-on-Write, PyArrow, testing, internals y arquitectura profesional."
language: es

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

course:
  path: initial.txt
  level_start: "cero"
  level_end: "experto"
  platform: "Python + pandas 3.x"
  style: "profundo, progresivo, práctico y técnico"

