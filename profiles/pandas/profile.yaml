  - reshaping
  - GroupBy
  - rolling and windows
  - time series
  - I/O
  - SQL
  - Parquet
  - PyArrow
  - method chaining
  - Copy-on-Write
  - performance
  - memory optimization
  - testing
  - troubleshooting
  - internals
