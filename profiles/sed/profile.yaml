name: sed
title: "sed — Learning Path 0 → Experto"
description: >
  Curso progresivo y profundo de GNU sed, desde los fundamentos del procesamiento
  de streams hasta pattern space, hold space, procesamiento multilínea, branching,
  portabilidad POSIX, seguridad, rendimiento e internals.

language: es
level: "0-to-expert"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

platform:
  primary: Fedora
  implementation: GNU sed
  shell: Bash/Zsh

objectives:
  - Dominar sed como editor de streams y no solo como colección de one-liners.
  - Comprender el ciclo interno de ejecución, pattern space y hold space.
  - Aplicar BRE y ERE correctamente en selección y transformación de texto.
  - Construir scripts sed mantenibles, robustos, seguros e idempotentes.
  - Dominar procesamiento multilínea, labels, branching y loops.
  - Diferenciar GNU sed, POSIX sed y aspectos relevantes de portabilidad.
  - Integrar sed con grep, awk, find, xargs, shell y herramientas Fedora.
  - Saber cuándo sed no es la herramienta apropiada.

lesson_structure:
  start: "🎯 OBJETIVO"
  sections:
    - "Explicación conceptual"
    - "Sintaxis"
    - "Ejemplos progresivos"
    - "🧪 Laboratorio"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
  end: "🧠 QUÉ DEBES RECORDAR"

content_requirements:
  examples: true
  exercises: true
  labs: true
  troubleshooting: true
  internals: true
  fedora_examples: true
  posix_portability: true
  security: true
  performance: true
  references_per_lesson: true

reference_policy:
  primary_book:
    title: "Definitive Guide to sed: Tutorial and Reference"
    author: "Daniel A. Goldman"
  primary_documentation:
    - "GNU sed manual"
    - "POSIX sed specification"
  rule: >
    El libro sirve como referencia pedagógica principal. La documentación oficial
    de GNU sed y POSIX se utiliza para validar sintaxis, comportamiento,
    extensiones y portabilidad.
