---
course:
  title: "Sed — 0 a Experto en Profundidad"
  language: "es"
  level:
    start: "cero"
    end: "experto"
  platform:
    primary:
      - Fedora
      - RHEL
      - Linux
    implementation: GNU sed
    shell: Bash/Zsh
  description: >
    Curso progresivo y profundo de GNU sed, desde los fundamentos del
    procesamiento de streams hasta pattern space, hold space,
    procesamiento multilínea, branching, portabilidad POSIX, seguridad,
    rendimiento e internals.
  mode: "deep"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

objectives:
  - Dominar sed como editor de streams y no solo como colección de one-liners.
  - Comprender el ciclo interno de ejecución, pattern space y hold space.
  - Aplicar BRE y ERE correctamente en selección y transformación de texto.
  - Construir scripts sed mantenibles, robustos, seguros e idempotentes.
  - Dominar procesamiento multilínea, labels, branching y loops.
  - Diferenciar GNU sed, POSIX sed y aspectos relevantes de portabilidad.
  - Integrar sed con grep, awk, find, xargs, shell y herramientas Fedora.
  - Comparar sed y awk y reconocer cuándo migrar una transformación al
      modelo de registros y campos de awk.
  - Saber cuándo sed no es la herramienta apropiada.

lesson_structure:
  start: "🎯 OBJETIVO"
  sections:
    - "Explicación conceptual"
    - "Sintaxis"
    - "Ejemplos progresivos"
    - "🧪 Laboratorio"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
  end: "🧠 QUÉ DEBES RECORDAR"

content_requirements:
  examples: true
  exercises: true
  labs: true
  troubleshooting: true
  internals: true
  fedora_examples: true
  posix_portability: true
  security: true
  performance: true
  references_per_lesson: true

reference_policy:
  primary_books:
    - title: "Definitive Guide to sed: Tutorial and Reference"
      author: "Daniel A. Goldman"
      role: "Referencia principal específica de sed"
    - title: "sed & awk"
      authors:
        - "Dale Dougherty"
        - "Arnold Robbins"
      role: "Segunda referencia principal para filosofía Unix, diseño
          de scripts e integración sed/awk"
  primary_documentation:
    - "GNU sed manual"
    - "POSIX sed specification"
  rule: >
    Los libros sirven como referencias pedagógicas principales.
    La documentación oficial de GNU sed y POSIX se utiliza para
    validar sintaxis, comportamiento, extensiones y portabilidad.
