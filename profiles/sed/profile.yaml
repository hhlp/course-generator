name: rpm
title: "RPM PACKAGING EN PROFUNDIDAD — FEDORA"

language: es

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

platform:
  primary: Fedora Linux
  ecosystem:
    - Fedora
    - RHEL
    - CentOS Stream

domain: rpm-packaging

level:
  start: beginner
  end: expert

description: >
  Ruta de aprendizaje completa y progresiva sobre RPM y el ecosistema
  de empaquetado de Fedora. Parte de los fundamentos del formato RPM
  y progresa hacia SPEC files, SRPM, dependencias, scriptlets, rpmdb,
  macros, generación automática de dependencias, Mock, rpmlint,
  Fedora Packaging Guidelines, COPR, dist-git, Koji, Bodhi,
  repositorios RPM e internals de RPM.

objectives:
  - Comprender completamente el formato y modelo de paquetes RPM.
  - Dominar NEVRA, EVR, arquitectura y metadata RPM.
  - Consultar, instalar, actualizar, verificar y eliminar paquetes.
  - Dominar la estructura y semántica de los archivos SPEC.
  - Construir paquetes binarios RPM y paquetes fuente SRPM.
  - Gestionar Sources y Patches correctamente.
  - Comprender BuildRequires, Requires y dependencias automáticas.
  - Dominar Provides, Conflicts, Obsoletes, weak y rich dependencies.
  - Dominar scriptlets, triggers, file triggers y transfiletriggers.
  - Comprender rpmdb y las operaciones internas de RPM.
  - Comprender la resolución de dependencias mediante libsolv.
  - Construir paquetes en entornos reproducibles con Mock.
  - Validar paquetes mediante rpmlint.
  - Aplicar las Fedora Packaging Guidelines.
  - Comprender Fedora Package Review, COPR, dist-git, Koji y Bodhi.
  - Crear y administrar repositorios RPM y comprender firmas.
  - Comprender internals de RPM y automatizar workflows de packaging.

pedagogy:
  progression: "0-to-expert"
  depth: deep
  style: technical-didactic
  theory_and_practice: true
  avoid_shallow_summaries: true
  explain_why: true
  explain_internals: true
  progressive_labs: true
  troubleshooting: true
  real_world_examples: true

lesson_structure:
  first_section:
    title: "🎯 OBJETIVO"
    required: true
  development:
    required: true
    depth: deep
  laboratory:
    title: "🧪 Laboratorio/ejemplos"
    required_when_useful: true
  common_errors:
    title: "⚠️ Errores frecuentes"
    required_when_useful: true
  important_idea:
    title: "💡 Idea importante"
    required_when_useful: true
  final_section:
    title: "🧠 QUÉ DEBES RECORDAR"
    required: true
    key_points:
      minimum: 3
      maximum: 7

technical_environment:
  distribution: Fedora Linux
  shell: zsh
  commands:
    - rpm
    - rpmquery
    - rpmverify
    - rpmkeys
    - rpmdb
    - rpm2cpio
    - rpmbuild
    - rpmspec
    - rpmdevtools
    - mock
    - rpmlint
    - createrepo_c
    - dnf
    - dnf5
    - fedpkg
    - koji
    - bodhi
    - copr

final_workflow:
  - upstream
  - source archive
  - SPEC
  - SRPM
  - Mock
  - rpmlint
  - Fedora Package Review
  - COPR
  - dist-git
  - Koji
  - Bodhi
  - repository

quality:
  factual_accuracy: high
  technical_depth: high
  practical_depth: high
  command_accuracy: high
  fedora_focus: high
  avoid_deprecated_practices: true
  mark_historical_features: true
  distinguish_rpm_from_dnf: true
  distinguish_upstream_from_fedora_policy: true
