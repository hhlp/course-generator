name: grafana-loki
title: GRAFANA + LOKI EN PROFUNDIDAD
platform: Fedora Linux

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  style: profundo, práctico, progresivo y orientado a administración real
  opening_section: "🎯 OBJETIVO"
  closing_section: "🧠 QUÉ DEBES RECORDAR"
  closing_key_points_min: 3
  closing_key_points_max: 7
  optional_sections:
    - "🧪 Laboratorio/ejemplos"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
  reading_section: "📚 LECTURA"
  indentation: false
  numbering: single-level

scope:
  primary_platform: Fedora Linux
  grafana_oss_primary: true
  loki_primary: true
  alloy_primary_collector: true
  prometheus_integration_only: true
  opentelemetry_integration_only: true
  kubernetes_required: false
  cloud_required: false
  windows: false

technology_policy:
  grafana:
    prefer_oss_foundations: true
    distinguish_enterprise: true
    distinguish_cloud: true
    verify_version_sensitive_features: true
  loki:
    prefer_tsdb_for_modern_deployments: true
    prefer_compactor_for_modern_retention: true
    distinguish_legacy_storage: true
    distinguish_deployment_modes: true
    treat_cardinality_as_cross_cutting_concern: true
  collection:
    prefer_grafana_alloy: true
    promtail_for_legacy_and_migration: true
  prometheus:
    teach_as_integration: true
    reteach_prometheus_path: false

lesson_structure:
  objective:
    required: true
    position: first
    heading: "🎯 OBJETIVO"

  reading:
    required: true
    heading: "📚 LECTURA"
    categories:
      - principal
      - normativa
      - profundizacion
      - consulta
    exact_references_only_when_verified: true

  lab:
    required: false
    heading: "🧪 Laboratorio/ejemplos"

  common_errors:
    required: false
    heading: "⚠️ Errores frecuentes"

  important_idea:
    required: false
    heading: "💡 Idea importante"

  remember:
    required: true
    position: last
    min_items: 3
    max_items: 7
    heading: "🧠 QUÉ DEBES RECORDAR"
    avoid_repeating_objective: true

quality:
  forbid_generic_scaffold: true
  require_topic_specific_headings: true
  require_topic_specific_examples: true
  require_self_contained_lesson: true
  audit_before_save: true
  repair_on_fail: true

output:
  format: markdown
  zip_block: true
  write_index: true
  write_manifest: true

artifacts:
  enabled: true
  default_strategy: auto
  overrides: {}

  project_policy:
    integrator_projects: auto
    diagnostic_projects: auto
    require_project_for_every_block: false

validation:
  enabled: false
  commands: []
