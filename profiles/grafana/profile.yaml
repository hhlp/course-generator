validation:
  enabled: false
  commands: []
depth_policy:
  level: expert
  preserve_existing_blocks_and_lessons: true
  topic_specific_architecture: true
  explain_configuration_options: true
  fedora_installation_when_applicable: true
  verify_commands_and_expected_results: true
  include_logs_and_troubleshooting_when_applicable: true
  include_security_performance_and_tradeoffs: true
  verify_version_sensitive_claims: true
  avoid_invented_defaults_endpoints_metrics: true
  hands_on_for_operational_procedures: true
  require_lab_for_every_conceptual_lesson: false
lab_quality:
  require_initial_state: true
  require_reproducible_steps: true
