name: database-design

description: >
  Diseño de bases de datos relacionales de cero a experto:
  teoría, normalización, costes y consistencia de agregados.

language: es

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  style: profundo, práctico, progresivo y orientado a diseño de bases de datos relacionales

  lesson_structure:
    required_opening: "🎯 OBJETIVO"
    required_reading: "📚 LECTURA"
    required_closing: "🧠 QUÉ DEBES RECORDAR"

    reading_categories:
      - principal
      - normativa
      - motor
      - profundizacion
      - consulta

    exact_references_only_when_verified: true

    optional_sections:
      - "🧪 Laboratorio/ejemplos"
      - "⚠️ Errores frecuentes"
      - "💡 Idea importante"

  closing_requirements:
    min_points: 3
    max_points: 7
    avoid_repeating_objective: true

  indentation: false
  numbering: single-level