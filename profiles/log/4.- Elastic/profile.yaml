---
course:
  title: ELASTIC STACK EN PROFUNDIDAD — FEDORA
  language: es
  level:
    start: cero
    end: experto
  objective: Enseñar Elastic Stack desde fundamentos hasta nivel experto,
    incluyendo Elasticsearch, Lucene, ingest pipelines, Logstash, Beats,
    Elastic Agent, Fleet, ECS, Kibana, alerting, seguridad, clustering, ILM,
    snapshots, rendimiento, troubleshooting, observabilidad e internals,
    con Fedora como plataforma principal. Incorporar búsqueda vectorial e
    híbrida, identidad federada, fiabilidad end-to-end, recuperación,
    automatización declarativa y pruebas de resiliencia.
  approach:
    - conceptual
    - practical
    - progressive
    - production_oriented
    - troubleshooting_oriented
    - internals_aware
  avoid:
    - superficial_summaries
    - command_dumps_without_explanation
    - obsolete_practices_presented_as_current
    - invented_commands_or_outputs
    - disabling_security_as_default_fix
    - universal_performance_magic_numbers
    - unnecessary_topic_duplication
  platform:
    - Fedora
    - RHEL
    - Linux
  mode: deep

files:
  pedagogy: ../../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

lesson:
  required_opening: 🎯 OBJETIVO
  required_closing: 🧠 QUÉ DEBES RECORDAR
  closing_key_points:
    min: 3
    max: 7
  optional_sections:
    - 🧪 Laboratorio / ejemplos
    - ⚠️ Errores frecuentes
    - 💡 Idea importante
  depth: deep
  style: didactic
  explain:
    - purpose
    - architecture_context
    - internal_operation_when_relevant
    - configuration
    - validation
    - failure_modes
    - troubleshooting
    - production_implications
  continuity:
    use_previous_lessons: true
    prepare_next_lessons: true
    avoid_full_repetition: true
    terminology_consistent: true

version_policy:
  prefer_current_stable_documentation: false
  verify_version_sensitive_features: true
  distinguish:
