  label_experimental_artifacts: true
  explicit_otlp_protocol: true
  verify_defaults_per_mode: true
  verify_semantic_conventions: true
laboratories:
  environment: local_private
  primary_runtime: Docker Compose
  alternative_runtime: Podman Compose after compatibility validation
  publish_interfaces: 127.0.0.1
  required_deliverables:
    - complete source and configuration
    - Maven commands and Gradle equivalents where relevant
    - pinned version matrix
    - expected trace tree and metric/log evidence
    - negative test and recovery
    - cleanup commands
  runnable_sources_in_this_package: false
assessment:
  unit_tests:
    - span relationships
    - context isolation
    - metric units and cardinality
    - log correlation
    - privacy
  integration_tests:
    - agent in separate JVM
    - OTLP reception
    - shutdown
    - dependency failures
  expert_project: orders-payments-inventory with JDBC and Kafka
