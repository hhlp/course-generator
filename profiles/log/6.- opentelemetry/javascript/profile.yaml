  verify_each_contrib_plugin: true
  do_not_assume_esm_support: true
  runtime_policy: Node.js LTS activo o en mantenimiento, admitido por los
    paquetes fijados
lesson_contract:
  include:
    - objetivo verificable
    - mecanismo y arquitectura
    - código JavaScript completo cuando aplique
    - instalación y configuración completas
    - comandos de ejecución
    - salida esperada y cómo verificarla
    - prueba negativa y diagnóstico
    - limpieza reversible
    - versiones y límites de soporte
  no_pseudocode_as_executable_lab: true
  typescript_must_not_replace_javascript: true
  browser_maturity_must_be_explicit: true
  avoid_sensitive_telemetry: true
lab_policy:
  default: local sin exposición pública
  ports: publicar solo en loopback
  containers:
    - Docker Compose
    - Podman Compose con compatibilidad verificada
  backends: elegir un stack mínimo y fijar versiones
  required_evidence:
    - traza con relaciones causales
    - métrica consultable
    - log correlacionado
    - fallo explicado con evidencia
  baseline_language: JavaScript
  optional_language: TypeScript
bibliography_policy:
  authority_order:
    - Especificaciones y convenciones OpenTelemetry
    - Documentación y código de OpenTelemetry JavaScript
    - Documentación de cada instrumentación contrib
    - Documentación del runtime y framework
    - Learning OpenTelemetry
  upstream_overrides_outdated_book_details: true
  do_not_limit_path_to_book: true
