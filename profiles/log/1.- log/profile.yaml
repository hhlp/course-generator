lesson_rules:
  explain_concept_before_command: true
  explain_pipeline_position: true
  distinguish_read_vs_modify_commands: true
  state_required_privileges: true
  prefer_dropins_when_supported: true
  validate_configuration_before_reload: true
  verify_effect_after_change: true
  include_recovery_or_rollback_when_useful: true
  use_current_installed_docs_when_version_sensitive: true
  explain_installation_when_relevant: true
  show_real_paths_units_and_packages: true
  include_logs_and_troubleshooting_when_relevant: true
  include_safe_failure_and_recovery_when_relevant: true
  verify_delivery_guarantees_empirically: true
fedora_rules:
  prefer_rpm_dnf: true
  prefer_systemd_native_tools: true
  use_firewalld: true
  keep_selinux_enforcing: true
  use_real_fedora_paths: true
  use_real_fedora_units: true
journald:
  treat_as_structured_event_store: true
  emphasize:
    - trusted fields
    - user fields
    - _TRANSPORT
    - _SYSTEMD_UNIT
    - _BOOT_ID
    - _MACHINE_ID
    - realtime timestamps
    - monotonic timestamps
    - persistent storage
    - runtime storage
    - vacuum
    - limits
    - namespaces
    - rate limiting
    - forwarding
    - sealing
syslog:
  separate_architecture_protocol_implementation: true
  standards:
    - RFC3164
    - RFC5424
    - RFC5425
    - RFC6587
    - RFC5426
    - RFC5848
  distinguish_transports:
    - UDP
    - TCP
    - TLS
    - RELP
rsyslog:
  prefer_modern_configuration: true
  teach_legacy_selectors_for_context: true
  emphasize:
    - input
    - ruleset
    - action
    - template
    - RainerScript
    - imjournal
    - imuxsock
    - imudp
    - imtcp
    - imfile
    - omfile
    - omfwd
    - queues
    - disk-assisted queues
    - parsing
    - normalization
    - TLS
    - RELP
syslog_ng:
  pipeline_model: source -> parser/filter/rewrite -> log path -> destination
  emphasize:
    - sources
    - destinations
    - filters
    - parsers
    - rewrites
    - templates
    - log paths
    - junctions
    - channels
    - flow-control
    - disk-buffer
    - TLS
    - routing
reliability:
  explain:
    - loss
    - duplication
    - ordering
    - retries
    - queues
    - buffers
    - persistence
    - backpressure
    - acknowledgements
    - at-most-once
    - at-least-once
    - limits_of_exactly_once
security:
  include:
    - least privilege
    - Unix permissions
    - ACL
    - SELinux
    - firewalld
    - TLS
    - mutual TLS
    - certificate validation
    - log injection
    - secret leakage
    - integrity
    - retention
  never_recommend:
    - disabling SELinux as a fix
    - opening broad firewall access without justification
    - skipping certificate verification in production
logrotate:
  emphasize:
    - open file descriptors
    - rename vs unlink
    - reopen behavior
    - SIGHUP
    - copytruncate risks
    - application-managed rotation
    - journal internal rotation
troubleshooting:
  methodology: pipeline-first
  pipeline:
    - producer
    - stdout_stderr_or_syslog
    - journald
    - local_input_or_forwarding
    - parser_filter_ruleset
    - queue_or_buffer
    - transport
    - network_firewall
    - TLS
    - collector
    - routing
    - storage
    - rotation
  preferred_tools:
    - journalctl
    - logger
    - systemd-cat
    - systemctl
    - systemd-analyze
    - rsyslogd
    - syslog-ng
    - logrotate
    - ss
    - lsof
    - fuser
    - tcpdump
    - openssl
    - firewall-cmd
    - ausearch
    - sealert
    - restorecon
    - semanage
    - jq
    - df
    - du
