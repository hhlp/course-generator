  goal: Construir una plataforma centralizada, segura, persistente
    y tolerante a fallos de logging sobre Fedora, con journald, rsyslog
    o syslog-ng, transporte seguro, queues/buffers, parsing, routing,
    almacenamiento, logrotate, SELinux, firewalld, troubleshooting,
    recuperación y dimensionamiento básico.
  acceptance_criteria:
    - demonstrate end-to-end traceability
    - quantify loss duplicates latency and queue backlog
