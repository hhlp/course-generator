technical_review:
  date: '2026-10-22'
  version_policy: Match official documentation to installed packages
    before using options.
  routing:
    - local journal or syslog socket
    - direct file input
    - direct network input
    - optional journal upload and remote
  required_distinctions:
    - ForwardToSyslog versus imjournal reading
    - syntax validation versus functional delivery
    - graceful shutdown versus abrupt failure
    - transport acknowledgement versus final durability
    - syslog-ng OSE versus AxoSyslog documentation
    - daemon-reload versus daemon reload or restart
  syslog_ng_option_mapping:
    mem-buf-size: flow-control-window-bytes
    disk-buf-size: capacity-bytes
    mem-buf-length: flow-control-window-size
  option_mapping_rule: Verify names and aliases against installed
    version.
  rsyslog_validation: Use -N1; document other levels before teaching
    them.
  lab_safety: Use bounded disposable filesystems for capacity failures.
