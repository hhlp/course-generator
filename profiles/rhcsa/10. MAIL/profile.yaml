compatibility:
  discover_installed_versions: true
  dovecot_branches:
    - '2.3'
    - '2.4'
  dovecot_24_notes:
    - mail_location se divide en mail_driver/mail_path y ajustes asociados
    - Validar dovecot_config_version y dovecot_storage_version
    - replicator y Director retirados; rediseñar HA según arquitectura soportada
  migration_requires:
    - ensayo aislado
    - validación de datos y metadatos
    - plan de reversión
  dmarc_current_rfcs:
    - 9989
    - 9990
    - 9991
  dmarc_legacy_rfcs:
    - 7489
  historic_tags:
    - pct
acceptance_criteria:
  - relay anónimo externo bloqueado
  - destinatario inexistente rechazado durante SMTP
  - remitente autenticado sin permiso denegado
  - baja IAM y cachés verificadas
  - userdb y passdb probadas por separado
  - Sieve ejecutado durante entrega
  - ACL de buzón compartido comprobada
  - caída IAM y filtro con recuperación
  - restore de mensajes y metadatos
  - mensaje aceptado recuperable tras caída de nodo
