---
course:
  title: MAIL — De 0 a Experto en Profundidad
  language: es
  level:
    start: "cero"
    end: "experto"
  description: 'Administración completa de infraestructura de correo electrónico
    en Fedora/RHEL: arquitectura, SMTP, Postfix, IMAP, Dovecot, SASL, TLS, SPF,
    DKIM, DMARC, seguridad, logging, observabilidad, alta disponibilidad y
    troubleshooting.'
  goal: Comprender y administrar un sistema de correo completo, desde DNS y
    SMTP hasta almacenamiento IMAP, autenticación del dominio, seguridad,
    observabilidad y diagnóstico end-to-end.
  mode: deep
  platform:
    primary:
      - Fedora
      - RHEL
      - Linux
    ecosystem:
      - RPM
      - DNF
      - systemd
      - journald
      - firewalld
      - SELinux

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

stack:
  protocols:
    - SMTP
    - ESMTP
    - Submission
    - IMAP
    - MIME
    - SASL
    - TLS
  services:
    - Postfix
    - Dovecot
    - Pigeonhole/Sieve
    - ManageSieve
    - Rspamd
  identity_integration:
    role: consumer
    standalone_modes:
      - local-system-users
      - virtual-users
    centralized_iam:
      - LDAP
      - Kerberos
      - FreeIPA
    integration_layers:
      - SASL
      - SSSD
      - PAM
    principle: Mail puede operar sin IAM centralizado; cuando existe IAM,
      Postfix/Dovecot consumen identidad/autenticación y no se convierten en
      el proveedor central.
    contract:
      - login
      - primary-address
      - aliases
      - mail-enabled
      - groups
      - UID/GID
      - mail-home
      - mail-path
      - quota
    required_distinctions:
      - autenticación frente a habilitación Mail
      - MAIL FROM frente a From visible
      - GSSAPI requiere userdb
      - PAM no sustituye userdb
      - caché SSSD frente a caché Dovecot
      - cuenta técnica vmail frente a identidad humana
    lifecycle:
      - alta centralizada
      - aprovisionamiento de buzón sin duplicar contraseñas
      - cambio de dirección y aliases
      - baja y revocación
      - sesiones abiertas y expiración de caché
      - retención y recuperación
  domain_authentication:
    - SPF
    - DKIM
    - DMARC
    - ARC
    - SRS
  transport_security:
    - STARTTLS
    - MTA-STS
    - TLS-RPT
    - DANE
  operations:
    - DNS
    - logging
    - monitoring
    - backup
    - disaster-recovery
    - high-availability
    - troubleshooting
    - IAM-integration
lesson_style:
  start_with: 🎯 OBJETIVO
  end_with: 🧠 QUÉ DEBES RECORDAR
  sections_when_useful:
