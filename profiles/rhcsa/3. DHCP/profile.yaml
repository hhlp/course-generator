      - Linux
    dhcp_implementation:
      - ISC Kea

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

objectives:
  - comprender DHCPv4 en profundidad
  - comprender DHCPv6 y su relación con SLAAC y Router Advertisement
  - instalar y administrar ISC Kea
  - configurar subnets, pools, leases y reservations
  - dominar DHCP options
  - implementar DHCP relay
  - implementar Kea High Availability
  - administrar logging y observabilidad
  - diagnosticar problemas mediante logs y packet capture
  - integrar DHCP con firewalld y SELinux
  - diseñar una infraestructura DHCP de producción
  - preparar la transición hacia DHCP y DNS dinámico

