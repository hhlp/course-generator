---
course:
  title: "DNS + BIND 9 — 0 a Experto en Profundidad"
  language: "es"
  level:
    start: "cero"
    end: "experto"
  mode: "deep"

files:
  pedagogy: ../../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

platform:
  primary:
    - Fedora
    - RHEL
    - Linux
  dns_server:
    - BIND 9
  components:
    - systemd
    - journald
    - NetworkManager
    - firewalld
    - SELinux

goals:
  - "Comprender DNS como protocolo jerárquico y distribuido, no solo
    como configuración de BIND."
  - "Administrar BIND 9 como servidor authoritative, recursive, caching
    y forwarding."
  - "Diseñar y operar zonas forward y reverse para IPv4 e IPv6."
  - "Dominar delegaciones, primary/secondary, AXFR, IXFR y NOTIFY."
  - "Aplicar ACL, TSIG, DNSSEC, DDNS, RPZ y hardening."
  - "Integrar BIND con Kea, FreeIPA y Kerberos."
  - "Distinguir DNS independiente de IAM de DNS como
    infraestructura/dependencia de IAM."
  - "Comprender que BIND no es normalmente un consumidor de identidades
    humanas, aunque DNS sea crítico para service discovery de
    Kerberos/LDAP/FreeIPA."
  - "Diagnosticar DNS desde el cliente hasta el servidor authoritative."
  - "Usar journald y logging propio de BIND para troubleshooting."
  - "Automatizar validación y despliegue con Git, CI y Ansible."
  - "Llegar a diseñar una infraestructura DNS empresarial resiliente
    y observable."

lesson_format:
  start: "🎯 OBJETIVO"
  end: "🧠 QUÉ DEBES RECORDAR"
  preferred_sections:
    - "Conceptos"
    - "Anatomía y funcionamiento"
    - "Comandos"
    - "Configuración"
    - "🧪 Laboratorio"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
    - "Troubleshooting"
    - "Referencias"
  require_explanations_before_commands: true
  explain_command_output: true
  include_verification_steps: true
  include_failure_cases: true

pedagogy:
  progression:
    - fundamentals
    - protocol
    - tools
    - bind-administration
    - authoritative
    - recursive-caching
    - zones
    - security
    - dnssec
    - ddns
    - observability
    - troubleshooting
    - automation
    - architecture
    - internals
    - expert
  laboratory_driven: true
  production_mindset: true
  avoid_copy_paste_only_learning: true
  correlate_configuration_with_protocol_behavior: true

labs:
  environment: "Fedora/RHEL virtual machines or equivalent isolated lab"
  require:
    - "command verification"
    - "configuration validation"
    - "service status"
    - "journal/log inspection"
    - "network packet inspection when useful"
    - "intentional failure and recovery in troubleshooting blocks"
  final_project:
    - "authoritative primary"
    - "authoritative secondary"
    - "separate recursive resolver"
    - "forward and reverse zones"
    - "IPv4 and IPv6"
    - "TSIG"
    - "DNSSEC"
    - "DDNS"
    - "Kea integration"
    - "ACL"
    - "SELinux"
    - "firewalld"
    - "logging"
    - "monitoring"
    - "backup and restore"
    - "Ansible automation"
    - "incident simulation and recovery"

logging:
  cover_journald: true
  cover_bind_logging: true
  journald_command: "journalctl -u named"
  dedicated_log_design: "/var/log/named/"
  warning: "No asumir que /var/log/named contiene logs por defecto; enseñar
    configuración, permisos, SELinux y rotación."

troubleshooting:
  priority: high
  methodology:
    - cliente
    - NSS/resolver local
    - recursive resolver
    - delegación
    - authoritative
    - respuesta
  tools:
    - dig
    - delv
    - host
    - getent
    - resolvectl
    - nmcli
    - rndc
    - named-checkconf
    - named-checkzone
    - journalctl
    - tcpdump
    - Wireshark
    - ss
    - strace

security:
  topics:
    - ACL
    - TSIG
    - DNSSEC
    - RRL
    - RPZ
    - SELinux
    - firewalld
    - least privilege
    - open resolver prevention
    - transfer restrictions
    - DDNS authorization

iam_relationship:
  role: "infraestructura/dependencia de IAM; no consumidor normal de
    identidades humanas"
  teach_both_modes: true
  standalone_dns:
    - "authoritative"
    - "recursive/caching"
    - "forwarding"
    - "DNSSEC"
    - "DDNS"
  integrated_dns:
    - "Kerberos service discovery"
    - "LDAP service discovery"
    - "SRV records"
    - "KDC discovery"
    - "FreeIPA integrated DNS"
    - "FreeIPA with external DNS"
    - "forward/reverse DNS for IAM"
    - "DDNS"
    - "TSIG vs GSS-TSIG concepts"
  troubleshooting_chain: "DNS -> SRV -> Kerberos/LDAP -> FreeIPA"

references:
  prefer_current_official_docs_for_version_specific_behavior: true
  use_rfc_at_advanced_levels: true
  core_rfc:
    - RFC1034
    - RFC1035
    - RFC1996
    - RFC2136
    - RFC2308
    - RFC2317
    - RFC8945
    - RFC3645
    - RFC1982
    - RFC8914
    - RFC4033
    - RFC4034
    - RFC4035
    - RFC5155
    - RFC5936
    - RFC6891
    - RFC7344
    - RFC7858
    - RFC8078
    - RFC8484
    - RFC9250

constraints:
  - "Priorizar Fedora/RHEL en ejemplos de administración del sistema."
  - "Distinguir conceptos DNS estándar de detalles específicos de BIND."
  - "Advertir cuando una opción o comportamiento dependa de la versión de BIND."
  - "No desactivar SELinux como solución de troubleshooting."
  - "No enseñar un open resolver como configuración válida de producción."
  - "Validar named.conf y las zonas antes de reload/restart siempre
    que sea posible."


revision_policy:
  preserve_existing_blocks_and_lessons: true
  architecture_block: 33
  implementation_block: 34
  distinguish_review_order_from_deployment_order: true
  lab_configurations_are_generated_with_lessons: true

dependencies:
  learning_order:
    - RHCSA base
    - TIME and basic DNS
    - operational DNS
    - IAM
    - DNS and IAM integrations
  standalone_dns_requires_iam: false
  time_sensitive_functions:
    - DNSSEC RRSIG inception and expiration
    - TSIG time window and BADTIME
    - Kerberos in integrated mode
  bootstrap:
    avoid_dns_time_cycle: true
    require_documented_initial_time_source: true
    verify_after_cold_boot: true
    systemd_order_is_not_readiness: true
    do_not_disable_validation_as_permanent_fix: true

integration_policy:
  identities_owned_by: IAM
  standalone_bind_has_no_parallel_user_directory: true
  freeipa_integrated_dns_managed_by_platform: true
  external_dns_publish_idm_required_records: true
  gss_tsig_practice:
    - DNS service principal and platform-managed keytab
    - kinit and klist
    - nsupdate -g
    - least-privilege update-policy
    - denied update and evidence-based diagnosis

lab_contract:
  network: isolated private network without public exposure
  reference_domain: lab.example.test
  ipv4_subnet: 192.168.56.0/24
  ipv6: generated ULA prefix with documented reverse zones
  roles:
    primary: 192.168.56.10
    secondary: 192.168.56.11
    resolver: 192.168.56.12
    client: 192.168.56.20
    time_source: 192.168.56.30
    optional_iam: 192.168.56.40
    optional_kea: 192.168.56.50
  private_dnssec_chain: local parent-child hierarchy or explicit trust anchor
  required_evidence:
    - installed versions and capability matrix
    - complete commented configuration and validation
    - expected queries and access denials
    - relevant logs and packet captures
    - failure diagnosis and recovery
    - restore and post-reboot verification
  final_profiles:
    - full standalone DNS infrastructure
    - extension with centrally managed IAM
  clock_failure_scope: disposable snapshot-based VMs only

advanced_operations:
  serial_arithmetic: RFC1982
  tsig_reference: RFC8945
  gss_tsig_reference: RFC3645
  extended_dns_errors: RFC8914
  require_dnstap_capability_check: true
  encrypted_dns_matrix:
    - incoming server support
    - outgoing resolver support
    - client tool support
    - package version and build features
  dnssec_rollover:
    - document TTL and propagation windows
    - coordinate DS with parent
    - verify through independent validating resolver
    - recover broken chain without permanent validation bypass
  backup_restore:
    - coherent dynamic zones and journal state
    - keys and DNSSEC metadata
    - isolated restore with permissions and SELinux checks
    - documented RPO and RTO
