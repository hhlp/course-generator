identity_model:
  provider: external-iam-path
  progression:
    - standalone-local-identity
    - centralized-identity-consumer
  consumers:
    nfs:
      standalone: UID/GID + sec=sys
      centralized: Kerberos/FreeIPA + sec=krb5/krb5i/krb5p
    samba:
      standalone: local users/groups + smbpasswd/pdbedit
      centralized: 'AD: winbindd para servidor Samba en RHEL; IdM:
        recorrido ipa-client-samba con soporte validado por versión'
    iscsi:
      standalone: IQN + ACL + CHAP
      centralized: normally not a human-IAM consumer
    autofs:
      standalone: mapas locales
      centralized: mapas IdM/LDAP mediante SSSD; acceso al recurso validado por
        separado
integrations:
  - Kerberos
  - IAM
  - Prometheus
  - Grafana
final_outcome: 'Diseñar, instalar, configurar, asegurar, monitorizar, optimizar
  y diagnosticar servicios NFS, autofs, Samba/SMB e iSCSI en Fedora/RHEL.

  '
lab_environment:
  preferred: máquinas virtuales Fedora/RHEL
  network: privada sin exposición pública
  storage: discos y datos desechables
  identity_scenarios:
    - autónomo
    - NFS/autofs con IdM
    - Samba con AD
    - Samba con IdM según soporte de versión
  provider_owner: PATH IAM; reutilizar identidades centrales existentes
operational_requirements:
  - Restauración de datos, ACL, xattrs e identidades; verificar SELinux
  - RPO/RTO medidos en laboratorio
  - Separar fallos de path, target, directorio, DNS y TIME
  - Validar configuración efectiva y logs reales por versión
  - Multipath no garantiza HA del target
  - Sin escrituras concurrentes multihost con XFS/ext4 sobre el mismo LUN
compatibility_notes:
  rhel_samba_domain_member: winbindd; SSSD no sustituye al backend soportado del
