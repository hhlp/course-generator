rules:
  - No convertir el curso en una repetición del PATH general de Python.
  - No reenseñar Regex; aplicarla únicamente donde sea necesaria.
  - No convertir el bloque de Ansible en una repetición del PATH general de
    Ansible; enseñar únicamente su aplicación profunda a Network Automation
    y Cisco.
  - Explicar por qué se selecciona cada librería, protocolo o framework.
  - Distinguir read-only automation de configuration automation.
  - No asumir que comando enviado significa cambio correcto.
  - Incluir pre-check, diff, post-check y rollback en cambios avanzados.
  - Incluir logging y troubleshooting de forma transversal.
  - No hardcodear credenciales.
  - No desactivar validación SSH/TLS como práctica de producción.
  - Controlar concurrencia y blast radius.
  - Preferir interfaces estructuradas/model-driven cuando sean apropiadas.
  - Mantener ejemplos Cisco, pero diseñar capas extensibles a multivendor.
  - Verificar capacidades y sintaxis específicas contra documentación vigente.
  - Aplicar backup, pre-check, diff y recuperación antes del primer cambio.
  - Estudiar fundamentos YANG en bloque 12 antes de NETCONF en bloque 13.
  - Distinguir configuración recopilada de estado operacional y data plane.
  - No reintentar escrituras con resultado incierto sin consultar el estado.
  - Impedir cambios simultáneos por dispositivo y revalidar el baseline.
  - Separar backups íntegros cifrados de copias redactadas para Git.
  - No sobrescribir intent de la SoT con observaciones sin control explícito.
  - Conservar subtemas al agrupar entradas Ansible en lecciones coherentes.
  - Validar capacidades por imagen y release; aportar alternativas
    reproducibles.
  - No presentar pruebas simuladas como evidencia de capacidad de equipos
    reales.
  - No afirmar que el currículo incluye scripts ejecutables aún no
    implementados.
