rules:
- No convertir el curso en una repetición del PATH general de Python.
- No reenseñar Regex; aplicarla únicamente donde sea necesaria.
- No convertir el bloque de Ansible en una repetición del PATH general de Ansible; enseñar únicamente su aplicación profunda a Network Automation y Cisco.
- Explicar por qué se selecciona cada librería, protocolo o framework.
- Distinguir read-only automation de configuration automation.
- No asumir que comando enviado significa cambio correcto.
- Incluir pre-check, diff, post-check y rollback en cambios avanzados.
- Incluir logging y troubleshooting de forma transversal.
- No hardcodear credenciales.
- No desactivar validación SSH/TLS como práctica de producción.
- Controlar concurrencia y blast radius.
- Preferir interfaces estructuradas/model-driven cuando sean apropiadas.
- Mantener ejemplos Cisco, pero diseñar capas extensibles a multivendor.
- Verificar capacidades y sintaxis específicas contra documentación vigente.
