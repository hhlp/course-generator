course:
  title: RPM PACKAGING EN PROFUNDIDAD — FEDORA
  language: "es"
  level:
    start: "cero"
    end: "experto"
  domain: "RPM PACKAGING"
  mode: "deep"
  platform:
    primary: Fedora Linux
    ecosystem:
      - Fedora
      - RHEL
      - Linux
  description: Ruta de aprendizaje completa y progresiva sobre RPM y el
    ecosistema de empaquetado de Fedora. Parte de los fundamentos del
    formato RPM y progresa hacia SPEC files, SRPM, dependencias, scriptlets,
    rpmdb, macros, generación automática de dependencias, Mock, rpmlint,
    Fedora Packaging Guidelines, COPR, dist-git, Koji, Bodhi, repositorios
    RPM e internals de RPM.

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

objectives:
  - Comprender completamente el formato y modelo de paquetes RPM.
  - Dominar NEVRA, EVR, arquitectura y metadata RPM.
  - Consultar, instalar, actualizar, verificar y eliminar paquetes.
  - Dominar la estructura y semántica de los archivos SPEC.
  - Construir paquetes binarios RPM y paquetes fuente SRPM.
  - Gestionar Sources y Patches correctamente.
  - Comprender BuildRequires, Requires y dependencias automáticas.
  - Dominar Provides, Conflicts, Obsoletes, weak y rich dependencies.
  - Dominar scriptlets, triggers, file triggers y transfiletriggers.
  - Comprender rpmdb y las operaciones internas de RPM.
  - Comprender la resolución de dependencias mediante libsolv.
  - Construir en entornos limpios y verificar reproducibilidad por separado.
  - Validar paquetes mediante rpmlint.
  - Aplicar las Fedora Packaging Guidelines.
  - Comprender Fedora Package Review, COPR, dist-git, Koji y Bodhi.
  - Crear y administrar repositorios RPM y comprender firmas.
  - Comprender internals de RPM y automatizar workflows de packaging.
  - Validar .rpmnew, .rpmsave y persistencia durante actualizaciones.
  - Mantener paquetes con rpmautospec y un historial Git verificable.
  - Completar un único mini-solver C/libsolv mediante hitos progresivos.
  - Separar las rutas de publicación COPR y Fedora oficial.
