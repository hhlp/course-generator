quality:
  factual_accuracy: high
  technical_depth: high
  practical_depth: high
  command_accuracy: high
  fedora_focus: high
  avoid_deprecated_practices: true
  mark_historical_features: true
  distinguish_rpm_from_dnf: true
  distinguish_upstream_from_fedora_policy: true