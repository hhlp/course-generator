name: rpm
title: "RPM PACKAGING EN PROFUNDIDAD — FEDORA"

language: es

platform:
  primary: Fedora Linux
  ecosystem:
    - Fedora
    - RHEL
    - CentOS Stream

domain: rpm-packaging

level:
  start: beginner
  end: expert

description: >
  Ruta de aprendizaje completa y progresiva sobre RPM y el ecosistema
  de empaquetado de Fedora. Parte de los fundamentos del formato RPM
  y progresa hacia SPEC files, SRPM, dependencias, scriptlets,
  rpmdb, macros, generación automática de dependencias, Mock,
  rpmlint, Fedora Packaging Guidelines, COPR, dist-git, Koji,
  Bodhi, repositorios RPM e internals de RPM.

objectives:
  - Comprender completamente el formato y modelo de paquetes RPM.
  - Dominar NEVRA, EVR, arquitectura y metadata RPM.
  - Consultar, instalar, actualizar, verificar y eliminar paquetes.
  - Dominar la estructura y semántica de los archivos SPEC.
  - Construir paquetes binarios RPM y paquetes fuente SRPM.
  - Gestionar Sources y Patches correctamente.
  - Comprender BuildRequires, Requires y dependencias automáticas.
  - Dominar Provides, Conflicts, Obsoletes y weak dependencies.
  - Comprender rich dependencies.
  - Dominar scriptlets, triggers y transfiletriggers.
  - Comprender rpmdb y las operaciones internas de RPM.
  - Analizar paquetes mediante las herramientas del ecosistema RPM.
  - Comprender la resolución de dependencias mediante libsolv.
  - Construir paquetes en entornos reproducibles con Mock.
  - Validar paquetes mediante rpmlint.
  - Aplicar las Fedora Packaging Guidelines.
  - Comprender el proceso Fedora Package Review.
  - Construir paquetes mediante COPR.
  - Trabajar con Fedora dist-git.
  - Comprender Koji y la infraestructura de build de Fedora.
  - Comprender Bodhi y el ciclo de actualización de Fedora.
  - Crear y administrar repositorios RPM.
  - Comprender firmas y verificación criptográfica.
  - Automatizar workflows de packaging.
  - Investigar los internals de RPM y su ecosistema.

pedagogy:
  progression: "0-to-expert"
  depth: deep
  style: technical-didactic
  theory_and_practice: true
  avoid_shallow_summaries: true
  explain_why: true
  explain_internals: true
  progressive_labs: true
  troubleshooting: true
  real_world_examples: true

lesson_structure:
  first_section:
    title: "🎯 OBJETIVO"
    required: true

  development:
    required: true
    depth: deep
    requirements:
      - Explicar conceptos antes de utilizarlos.
      - Explicar qué problema resuelve cada mecanismo.
      - Relacionar el contenido con RPM y Fedora.
      - Explicar comandos y opciones relevantes.
      - Explicar metadata y estructuras internas cuando corresponda.
      - Mostrar ejemplos realistas.
      - Relacionar cada concepto con conocimientos anteriores.
      - Evitar limitarse a enumerar comandos.

  laboratory:
    title: "🧪 Laboratorio/ejemplos"
    required_when_useful: true

  common_errors:
    title: "⚠️ Errores frecuentes"
    required_when_useful: true

  important_idea:
    title: "💡 Idea importante"
    required_when_useful: true

  final_section:
    title: "🧠 QUÉ DEBES RECORDAR"
    required: true
    key_points:
      minimum: 3
      maximum: 7
    requirements:
      - Sintetizar las ideas esenciales de la lección.
      - No repetir simplemente el objetivo.
      - Priorizar conceptos reutilizables en lecciones posteriores.

technical_environment:
  distribution: Fedora Linux
  shell: zsh
  commands:
    - rpm
    - rpmquery
    - rpmverify
    - rpmkeys
    - rpmdb
    - rpm2cpio
    - rpmbuild
    - rpmspec
    - rpmdevtools
    - mock
    - rpmlint
    - createrepo_c
    - dnf
    - dnf5
    - fedpkg
    - koji
    - bodhi
    - copr

