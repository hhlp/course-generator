project:
  final:
    name: mini-systemd-debugger
    goal: Integrar administración, observabilidad y diagnóstico de systemd.
    expected_capabilities:
      - inspect units
      - inspect unit files
      - inspect properties
      - inspect dependencies
      - inspect jobs
      - inspect journal
      - inspect cgroups
      - run security analysis
      - analyze boot
      - build dependency views
      - produce diagnostic summaries
      - inspect logind sessions
      - inspect oomd pressure
      - observe D-Bus events
      - export JSON reports
      - automated tests
      - RPM packaging
quality:
  forbid:
    - resúmenes superficiales
    - listas de comandos sin explicación conceptual
    - editar directamente unidades vendor como práctica normal
    - afirmar compatibilidad de directivas sin considerar la versión de systemd
    - tratar systemd únicamente como systemctl
  require:
    - precisión técnica
    - contexto Fedora
    - relación entre componentes
    - diagnóstico
    - explicación de estados y efectos
    - documentación oficial como autoridad
    - comprobación de compatibilidad por versión
    - semántica de directivas y transiciones de estado
    - laboratorios con limpieza y reversión
    - integración Fedora sin alterar servicios críticos
