---
course:
  title: 'MongoDB: consultas y búsquedas de cero a experto'
  language: es
  level:
    start: cero
    end: experto
  domain: MongoDB Administrator
  mode: deep
  format: Especificación pedagógica independiente; adaptar claves si el
    generador exige otro esquema.
  primary_environment: Exclusivamente MongoDB Atlas con datasets oficiales;
    herramientas cliente en el equipo del alumno
files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md
tools:
  - mongosh
  - MongoDB Compass
  - PyMongo
prerequisites:
  - Uso básico de terminal y archivos
  - Python básico antes del bloque de PyMongo
lesson_structure:
  - 🎯 OBJETIVO medible
  - Conceptos y modelo mental
  - Sintaxis y opciones relevantes
  - Ejemplos progresivos ejecutables
  - 🧪 Lab con dataset, prerrequisitos y comprobaciones
  - ⚠️ Errores frecuentes y diagnóstico
  - 💡 Idea clave y alternativas
  - 🧠 Recordar
  - Ejercicios y soluciones razonadas
  - Referencias oficiales y compatibilidad
depth_requirements:
  - 'No limitarse a enumerar operadores: explicar semántica, límites,
    coste y alternativas.'
  - Cada laboratorio debe indicar entradas, pasos, resultados verificables
    y limpieza.
  - Inspeccionar tipos y campos reales; no depender de conteos exactos
    de datasets mutables.
  - Separar scripts de mongosh, código Python, JSON de índices y comandos
    de terminal.
  - Explicar la cardinalidad de cada etapa de agregación y el efecto de
    arrays y joins.
  - Comprobar versión del servidor, driver, plan y disponibilidad antes
    de usar funciones.
  - Registrar modelo, dimensión, métrica y representación BSON de cada
    campo vectorial.
  - No introducir vectores arbitrarios ni mezclar embeddings de modelos
    diferentes.
  - Medir calidad y latencia de búsqueda con corpus de consultas y juicios
    de relevancia.
  - La profundidad se centra en consultas y recuperación de información,
    sin operar servidores.
  - RAG es una ampliación opcional, posterior a evaluar la recuperación.
  - Cada práctica indica las capacidades de Atlas necesarias y alternativas
    dentro de su alcance.
datasets:
  main: sample_mflix
  additional:
    - sample_supplies
    - sample_airbnb
    - sample_analytics
    - sample_geospatial
    - sample_training
    - sample_guides
lab_safety:
  writes: Colecciones derivadas en lab_mongodb; conservar los datos de
    ejemplo de referencia.
  credentials: Variables externas y ejemplos ficticios; nunca secretos
    en archivos.
  network: Acceso acotado al entorno del alumno.
  cost: Verificar plan y estimar costes antes de crear recursos adicionales.
assessment:
  pass: Resolver consultas sin copiar, justificar semántica e índices
    y aportar resultados reproducibles.
  evidence:
    - Consultas y pipelines
    - Planes explain
    - Pruebas de resultados y cardinalidad
    - Benchmark ANN/ENN
    - Juicios de relevancia
    - Comparación de búsqueda textual, vectorial e híbrida
estimated_effort:
  hours: 300–450
  nature: Estimación orientativa para estudiar y practicar; avance por
    dominio demostrado.
