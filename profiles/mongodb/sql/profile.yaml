scope:
  required:
    - CRUD
    - Modelado y validación para consultas
    - Aggregation Pipeline
    - Índices y explain
    - PyMongo para consultar Atlas
    - MongoDB Search
    - Vector Search
    - Búsqueda híbrida y evaluación
    - Búsqueda geoespacial
  optional:
    - RAG como consumidor de la recuperación
  excluded:
    - Administración de servidores y nodos
    - Replica sets y elecciones
    - Alta disponibilidad operativa
    - Sharding
    - Backups y recuperación de infraestructura
    - Laboratorios locales de MongoDB
    - Terraform y Ansible
