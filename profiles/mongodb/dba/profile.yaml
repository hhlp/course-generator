---
course:
  title: 'MongoDB administrador: de 0 a experto'
  language: "es"
  level:
    start: "cero"
    end: "experto"
  domain: "MongoDB Administrator"
  mode: "deep"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

scope:
  - Autogestionado Community
  - Atlas
  - Enterprise condicionado a disponibilidad

prerequisites:
  - Linux y redes se introducen en el bloque 1
  - Ansible y Terraform antes del bloque 26
  - Kubernetes antes de la extensión del bloque 29
  - Kerberos básico para ejecutar el laboratorio Enterprise

environment:
  host: Fedora/Linux con VMs o contenedores
  server_os: Distribución compatible con la versión MongoDB elegida
  network: Privada; instancia inicial en loopback
  version_policy: Fijar y registrar versiones; revisar compatibilidad oficial
  replica_set: Tres miembros con datos
  sharding: Dos shards de tres miembros, CSRS de tres y dos mongos
  configuration: Estática explícita por nodo en config/
  datasets:
    - Datos sintéticos
    - Sample datasets compatibles de Atlas
  container_tracks:
    - Docker con Compose
    - Podman con proveedor Compose verificado y Quadlet
  kubernetes_track: Bloques 29–30; operator, edición y CSI compatibles

lesson_format:
  - 🎯 OBJETIVO
  - 💡 IDEA
  - Procedimiento explicado
  - 🧪 LAB
  - Logs y diagnóstico
  - ⚠️ ERRORES
  - 🧠 RECORDAR
  - Evaluación y fuentes

assessment:
  pass_score: 80
  mandatory:
    - Restauración verificada
    - Failover medido
    - Acceso restringido
    - Secretos protegidos
    - Datos persistentes

schema_note: Perfil declarativo; integración con course-generator no ejecutada.

blocks:
  - id: 0
    title: Fundamentos del administrador MongoDB
    lessons:
      - id: '0.1'
        title: Funciones del DBA y límites con desarrollo y SRE
      - id: '0.2'
        title: Documentos BSON, colecciones, bases de datos y namespaces
      - id: '0.3'
        title: CRUD mínimo para verificar operaciones administrativas
      - id: '0.4'
        title: >-
          Índices, agregaciones y transacciones: mapa para el administrador
      - id: '0.5'
        title: Disponibilidad, durabilidad, consistencia y escalabilidad
      - id: '0.6'
        title: RPO, RTO, SLI, SLO y presupuesto de error
      - id: '0.7'
        title: 'Community, Enterprise y Atlas: capacidades y responsabilidades'
      - id: '0.8'
        title: >-
          Standalone, replica set y sharded cluster: criterios de elección
      - id: '0.9'
        title: Versiones, ciclo de soporte, compatibilidad y documentación
          versionada
      - id: '0.10'
        title: Inventario, glosario, riesgos y plan de aprendizaje
    lab: Inventariar una instalación ficticia y proponer topología, edición, RPO
      y RTO con justificación.

  - id: 1
    title: Linux, redes y laboratorio reproducible
    lessons:
      - id: '1.1'
        title: Terminal, procesos, usuarios de servicio y permisos
      - id: '1.2'
        title: Paquetes, repositorios, firmas y versiones fijadas
      - id: '1.3'
        title: Discos, particiones, LVM, montajes y espacio disponible
      - id: '1.4'
        title: DNS directo e inverso, FQDN, resolución y /etc/hosts
      - id: '1.5'
        title: TCP, puertos, rutas y diagnóstico con ss y tcpdump
      - id: '1.6'
        title: Chrony y sincronización horaria
      - id: '1.7'
        title: systemd, límites de recursos y dependencias
      - id: '1.8'
        title: journald, /var/log y rotación de registros
      - id: '1.9'
        title: 'SELinux y firewalld: diagnóstico sin desactivarlos'
      - id: '1.10'
        title: VMs, redes privadas, inventario y snapshots de laboratorio
    lab: Crear tres VMs con nombres estables, hora sincronizada y conectividad
      privada; entregar inventario y pruebas DNS.

  - id: 2
    title: Arquitectura e internals operativos
    lessons:
      - id: '2.1'
        title: mongod, mongos, mongosh y Database Tools
      - id: '2.2'
        title: Ruta de una lectura y de una escritura
      - id: '2.3'
        title: WiredTiger, caché interna y caché del sistema operativo
      - id: '2.4'
        title: Journal, checkpoints y recuperación tras reinicio
      - id: '2.5'
        title: Concurrencia, locks y control de admisión
      - id: '2.6'
        title: Sesiones, cursores y operaciones de larga duración
      - id: '2.7'
        title: Replicación, oplog y avance del commit point
      - id: '2.8'
        title: Catálogo, metadatos, colecciones e índices
      - id: '2.9'
        title: 'Motores de ejecución y planes: implicaciones operativas'
      - id: '2.10'
        title: Límites y restricciones que afectan al diseño
    lab: Seguir una escritura desde el cliente hasta su persistencia y explicar
      qué se pierde en distintos fallos.

  - id: 3
    title: Instalación y primer despliegue
    lessons:
      - id: '3.1'
        title: Seleccionar versión y sistema operativo oficialmente compatible
      - id: '3.2'
        title: Repositorio oficial, firma y paquetes del servidor
      - id: '3.3'
        title: Instalar mongosh y Database Tools con su compatibilidad
      - id: '3.4'
        title: Instalación reproducible en Linux de la familia RHEL
      - id: '3.5'
        title: Alternativa Debian o Ubuntu y diferencias de paquetes
      - id: '3.6'
        title: 'Fedora como host: VM compatible o contenedor según soporte'
      - id: '3.7'
        title: Directorios de datos, logs, configuración y propietario
      - id: '3.8'
        title: 'Servicio mongod: arranque, parada y habilitación'
      - id: '3.9'
        title: Primera conexión local y comprobaciones funcionales
      - id: '3.10'
        title: Desinstalación controlada, conservación y borrado de datos de
          laboratorio
    lab: Instalar una instancia aislada desde cero, verificar servicio y
      persistencia y documentar paquetes y rutas reales.

  - id: 4
    title: Configuración operativa y gestión del servicio
    lessons:
      - id: '4.1'
        title: Anatomía de mongod.conf y tipos de datos YAML
      - id: '4.2'
        title: storage.dbPath y configuración de almacenamiento
      - id: '4.3'
        title: systemLog, destino, formato y verbosity
      - id: '4.4'
        title: net.bindIp, puertos y exposición restringida
      - id: '4.5'
        title: processManagement y ejecución bajo systemd
      - id: '4.6'
        title: 'security y replication: preparación de configuración'
      - id: '4.7'
        title: Overrides de systemd y límites efectivos del proceso
      - id: '4.8'
        title: Configuración estática por nodo en config/
      - id: '4.9'
        title: Validación, revisión de cambios y rollback de configuración
      - id: '4.10'
        title: Reinicio ordenado, readiness y comprobación posterior
    lab: Crear configuraciones independientes por nodo, introducir un error
      YAML, diagnosticarlo en logs y recuperar el servicio.

  - id: 5
    title: Administración de datos y tareas cotidianas
    lessons:
      - id: '5.1'
        title: Explorar bases, colecciones, estadísticas y tamaños
      - id: '5.2'
        title: Crear colecciones y opciones administrativas
      - id: '5.3'
        title: Validación de documentos y cambios de esquema
      - id: '5.4'
        title: Índices básicos para diagnóstico y mantenimiento
      - id: '5.5'
        title: TTL, caducidad y efecto de borrados masivos
      - id: '5.6'
        title: Importación y exportación con mongoimport y mongoexport
      - id: '5.7'
        title: Copia lógica inicial con mongodump y restauración aislada
      - id: '5.8'
        title: Usuarios de operación y scripts seguros con mongosh
      - id: '5.9'
        title: Sesiones, cursores, currentOp y cancelación selectiva
      - id: '5.10'
        title: Checklist diaria, inventario y registro de cambios
    lab: Crear datos sintéticos, aplicar validación y TTL, restaurar una copia
      inicial y verificar recuentos y contenido.

  - id: 6
    title: Almacenamiento y durabilidad
    lessons:
      - id: '6.1'
        title: Requisitos de filesystem y Production Notes de la versión
      - id: '6.2'
        title: XFS, ext4 y criterios de elección según soporte
      - id: '6.3'
        title: IOPS, throughput, latencia y colas de disco
      - id: '6.4'
        title: Working set, RAM, swap y presión de memoria
      - id: '6.5'
        title: Caché WiredTiger, eviction y páginas sucias
      - id: '6.6'
        title: 'Journal, checkpoints y write concern: diferencias'
      - id: '6.7'
        title: Compresión de datos e índices y coste de CPU
      - id: '6.8'
        title: Espacio lógico, espacio asignado y fragmentación
      - id: '6.9'
        title: compact, validate y límites de las herramientas de reparación
      - id: '6.10'
        title: Mover dbPath con permisos, SELinux y validación posterior
    lab: Medir una carga antes y después de cambiar de volumen; distinguir
      latencia de almacenamiento de presión de caché.

  - id: 7
    title: Conectividad y clientes desde operaciones
    lessons:
      - id: '7.1'
        title: URI estándar, seed list y credenciales codificadas
      - id: '7.2'
        title: mongodb+srv, registros SRV/TXT y resolución DNS
      - id: '7.3'
        title: Descubrimiento de topología y selección de servidor
      - id: '7.4'
        title: Replica set name, directConnection y uso diagnóstico
      - id: '7.5'
        title: Timeouts de conexión, selección y operaciones
      - id: '7.6'
        title: Pools, maxPoolSize, colas y tormentas de conexiones
      - id: '7.7'
        title: Retryable reads y writes y límites de idempotencia
      - id: '7.8'
        title: Firewalls, NAT y nombres anunciados por los miembros
      - id: '7.9'
        title: TLS desde el cliente y diagnóstico con OpenSSL
      - id: '7.10'
        title: Pruebas con cliente mínimo y trazas de errores
    lab: Conectar un cliente al replica set futuro, reproducir fallos DNS y de
      certificados y explicar el error observado.

  - id: 8
    title: Identidades, usuarios y autorización
    lessons:
      - id: '8.1'
        title: Autenticación frente a autorización y authSource
      - id: '8.2'
        title: Excepción localhost y bootstrap del primer administrador
      - id: '8.3'
        title: SCRAM y credenciales de cuentas humanas y de servicio
      - id: '8.4'
        title: Roles integrados y ámbito de base de datos
      - id: '8.5'
        title: Roles personalizados y mínimo privilegio
      - id: '8.6'
        title: Separación entre userAdmin, clusterAdmin y tareas de backup
      - id: '8.7'
        title: Altas, cambios, bajas y revisión de permisos efectivos
      - id: '8.8'
        title: Rotación de contraseñas y almacenamiento de secretos
      - id: '8.9'
        title: Usuarios de emergencia y recuperación de acceso documentada
      - id: '8.10'
        title: Pruebas positivas y negativas de autorización
    lab: Crear roles de lectura, aplicación, monitorización y backup; demostrar
      con pruebas qué puede y qué no puede hacer cada uno.

  - id: 9
    title: TLS y seguridad de red
    lessons:
      - id: '9.1'
        title: PKI, CA, cadena de confianza, SAN y vigencia
      - id: '9.2'
        title: Emitir certificados de laboratorio por hostname
      - id: '9.3'
        title: TLS entre cliente y servidor
      - id: '9.4'
        title: TLS entre miembros y routers
      - id: '9.5'
        title: Autenticación interna con keyfile y permisos
      - id: '9.6'
        title: Autenticación X.509 de clientes y miembros
      - id: '9.7'
        title: Rotación de keyfile y certificados con continuidad
      - id: '9.8'
        title: Red privada, segmentación y reglas mínimas de firewall
      - id: '9.9'
        title: Cifrado de volúmenes, copias y secretos
      - id: '9.10'
        title: Auditoría de configuración y comprobación de superficie expuesta
    lab: Proteger un despliegue con TLS y autenticación interna, rotar un
      certificado y detectar un SAN incorrecto.

  - id: 10
    title: Enterprise e integración con IAM
    lessons:
      - id: '10.1'
        title: Matriz de capacidades Community, Enterprise y Atlas
      - id: '10.2'
        title: 'Kerberos: KDC, realm, principal y ticket'
      - id: '10.3'
        title: DNS, hora y principals mongodb/FQDN
      - id: '10.4'
        title: Keytabs y permisos del servicio mongod
      - id: '10.5'
        title: Usuarios en $external y asignación de roles
      - id: '10.6'
        title: Configurar autenticación Kerberos en Enterprise
      - id: '10.7'
        title: Diagnosticar GSSAPI, tickets caducados y keytabs
      - id: '10.8'
        title: >-
          SSO de la consola y autenticación de base de datos: ámbitos distintos
      - id: '10.9'
        title: 'Auditoría Enterprise y cifrado nativo: requisitos y operación'
      - id: '10.10'
        title: Diseño de integración IAM y alternativa Community con SCRAM/X.509
    lab: Diseñar una integración con MIT Kerberos o FreeIPA y, si hay Enterprise
      disponible, validar acceso y fallos de reloj.

  - id: 11
    title: Replica sets desde cero
    lessons:
      - id: '11.1'
        title: Miembros primary y secondary y estados del replica set
      - id: '11.2'
        title: Mayoría, votos y prioridad
      - id: '11.3'
        title: Topología de tres miembros con datos
      - id: '11.4'
        title: DNS, conectividad, keyfile y TLS por nodo
      - id: '11.5'
        title: Inicialización y configuración mediante rs.initiate
      - id: '11.6'
        title: Inspección con rs.status y rs.conf
      - id: '11.7'
        title: Oplog, replicación asíncrona y replication lag
      - id: '11.8'
        title: Initial sync y requisitos de disco y red
      - id: '11.9'
        title: Conexión de clientes y escritura verificada
      - id: '11.10'
        title: Conversión de standalone a replica set
    lab: Desplegar rs0 con tres miembros con datos, autenticación y TLS;
      demostrar replicación y acceso mediante URI de topología.

  - id: 12
    title: Elecciones, fallos y alta disponibilidad
    lessons:
      - id: '12.1'
        title: Heartbeats, términos y condiciones de elección
      - id: '12.2'
        title: Prioridad, elegibilidad y ubicación de miembros
      - id: '12.3'
        title: Mayoría y comportamiento ante pérdida de quórum
      - id: '12.4'
        title: Stepdown planificado y elecciones observadas
      - id: '12.5'
        title: Caída del primary y reconexión del cliente
      - id: '12.6'
        title: Particiones de red y evitación de dos primaries efectivos
      - id: '12.7'
        title: 'Arbiters: límites de durabilidad y criterios para evitarlos'
      - id: '12.8'
        title: 'Dominios de fallo: proceso, host, zona y región'
      - id: '12.9'
        title: Distribución geográfica y latencia de mayoría
      - id: '12.10'
        title: Medir disponibilidad real y validar objetivos de recuperación
    lab: Detener un primary y aislar un miembro en laboratorio; medir
      interrupción del cliente, elección y escrituras confirmadas.

  - id: 13
    title: Consistencia, durabilidad y transacciones
    lessons:
      - id: '13.1'
        title: Write concern y acknowledgement
      - id: '13.2'
        title: majority, journaling y defaults efectivos
      - id: '13.3'
        title: Read preference y posibles lecturas atrasadas
      - id: '13.4'
        title: Read concern local, majority y snapshot
      - id: '13.5'
        title: Sesiones y consistencia causal
      - id: '13.6'
        title: Transacciones multidocumento y costes operativos
      - id: '13.7'
        title: Reintentos de transacciones y resultados inciertos
      - id: '13.8'
        title: Rollback de escrituras y análisis de consecuencias
      - id: '13.9'
        title: maxTimeMS, timeouts y problemas de semántica
      - id: '13.10'
        title: Matriz de garantías por topología y configuración
    lab: Comparar lecturas y escrituras con diferentes concerns durante un
      failover y registrar resultados confirmados e inciertos.

  - id: 14
    title: Operación y mantenimiento de replica sets
    lessons:
      - id: '14.1'
        title: Añadir, sustituir y retirar miembros
      - id: '14.2'
        title: Cambiar votos y prioridades con control de riesgo
      - id: '14.3'
        title: 'Miembros hidden y delayed: aplicaciones y límites'
      - id: '14.4'
        title: Planificar y redimensionar la ventana del oplog
      - id: '14.5'
        title: Diagnosticar lag y seleccionar fuente de sincronización
      - id: '14.6'
        title: Resync de miembro y coste de initial sync
      - id: '14.7'
        title: Mantenimiento rolling y reinicios controlados
      - id: '14.8'
        title: Reemplazar disco o VM sin perder mayoría
      - id: '14.9'
        title: Recuperación de miembro atrasado fuera del oplog
      - id: '14.10'
        title: 'Reconfiguración forzada: último recurso y riesgo de rollback'
    lab: Sustituir un secondary, provocar retraso controlado y recuperarlo
      conservando un servicio utilizable y evidencias del estado.

  - id: 15
    title: Monitorización, logs y alertas
    lessons:
      - id: '15.1'
        title: Baseline y señales de salud por componente
      - id: '15.2'
        title: serverStatus, dbStats y collStats
      - id: '15.3'
        title: mongostat y mongotop en diagnóstico
      - id: '15.4'
        title: Logs estructurados, niveles y correlación temporal
      - id: '15.5'
        title: Rotación de logs y permisos de /var/log
      - id: '15.6'
        title: FTDC y recopilación de evidencias
      - id: '15.7'
        title: Monitorizar latencia, errores, conexiones y colas
      - id: '15.8'
        title: Métricas de caché, disco, replicación y sharding
      - id: '15.9'
        title: Prometheus, exporter compatible y Grafana como integración
          opcional
      - id: '15.10'
        title: Alertas accionables, umbrales y runbooks
    lab: Crear un panel y tres alertas con runbook; provocar lag, disco próximo
      al límite y errores de autenticación en laboratorio.

  - id: 16
    title: Rendimiento y gestión de índices
    lessons:
      - id: '16.1'
        title: Definir workload y objetivos p50, p95 y p99
      - id: '16.2'
        title: explain y claves/documentos examinados
      - id: '16.3'
        title: Índices compuestos, multikey, parciales y cubiertos
      - id: '16.4'
        title: Selectividad, orden de campos y coste de escritura
      - id: '16.5'
        title: Sort, agregaciones, memoria y spill a disco
      - id: '16.6'
        title: 'Profiler y slow query logs: coste y datos sensibles'
      - id: '16.7'
        title: Plan cache y cambios de plan según versión
      - id: '16.8'
        title: Construcción de índices y commit quorum
      - id: '16.9'
        title: Índices hidden, detección de no usados y retirada controlada
      - id: '16.10'
        title: Comparación reproducible antes/después y prevención de
          regresiones
    lab: Diagnosticar tres cargas lentas y justificar cada índice con explain,
      latencia y coste de escritura medidos.

  - id: 17
    title: Capacidad y escalado vertical
    lessons:
      - id: '17.1'
        title: Dimensionar documentos, índices y crecimiento
      - id: '17.2'
        title: Working set y presupuesto de RAM
      - id: '17.3'
        title: CPU, concurrencia y saturación
      - id: '17.4'
        title: Disco, IOPS y espacio de margen
      - id: '17.5'
        title: Conexiones y límites efectivos
      - id: '17.6'
        title: Coste de backups, initial sync y mantenimiento
      - id: '17.7'
        title: Pruebas de carga representativas y límites del generador
      - id: '17.8'
        title: Escalado vertical y sustitución rolling de hosts
      - id: '17.9'
        title: Compresión, retención y archivado de datos
      - id: '17.10'
        title: Informe de capacidad, coste y previsión de saturación
    lab: Construir una previsión de seis meses y decidir si ampliar recursos,
      reducir retención o considerar sharding.

  - id: 18
    title: Backups y restauración verificable
    lessons:
      - id: '18.1'
        title: Amenazas, RPO/RTO y política de retención
      - id: '18.2'
        title: Replicación frente a backup y snapshots de VM
      - id: '18.3'
        title: 'mongodump y mongorestore: opciones y compatibilidad'
      - id: '18.4'
        title: Consistencia de dumps, oplog y restricciones
      - id: '18.5'
        title: Restaurar bases y namespaces a destino aislado
      - id: '18.6'
        title: Snapshots de filesystem y requisitos de consistencia
      - id: '18.7'
        title: Backup coordinado de sharded clusters
      - id: '18.8'
        title: Cifrado, inmutabilidad, separación de credenciales y catálogo
      - id: '18.9'
        title: 'Ops Manager y Atlas: métodos gestionados y requisitos'
      - id: '18.10'
        title: Pruebas periódicas de restore y medición de RPO/RTO
    lab: Restaurar un backup a infraestructura limpia, validar datos e índices y
      medir la pérdida temporal y el tiempo total de recuperación.

  - id: 19
    title: Recuperación ante desastres
    lessons:
      - id: '19.1'
        title: Inventario de dependencias y escenarios de desastre
      - id: '19.2'
        title: Borrado accidental y corrupción lógica
      - id: '19.3'
        title: Pérdida de un miembro, mayoría y sitio completo
      - id: '19.4'
        title: Seleccionar fuente de recuperación y preservar evidencias
      - id: '19.5'
        title: 'PITR: requisitos, herramientas y disponibilidad'
      - id: '19.6'
        title: Restaurar identidades, certificados y configuración
      - id: '19.7'
        title: Recuperación de replica set y reconexión de aplicaciones
      - id: '19.8'
        title: Recuperación coordinada de clúster sharded
      - id: '19.9'
        title: Failback, validación funcional y reconciliación
      - id: '19.10'
        title: Simulacro y retrospectiva con acciones correctivas
    lab: Simular pérdida del sitio de laboratorio y reconstruir desde backup sin
      reutilizar los volúmenes originales.

  - id: 20
    title: Arquitectura y despliegue de sharding
    lessons:
      - id: '20.1'
        title: Cuándo sharding resuelve un problema y cuándo añade coste
      - id: '20.2'
        title: Shards como replica sets y papel de mongos
      - id: '20.3'
        title: Config server replica set y metadatos
      - id: '20.4'
        title: Topología de dos shards, tres config servers y dos routers
      - id: '20.5'
        title: TLS, autenticación y red de todos los componentes
