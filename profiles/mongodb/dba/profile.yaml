  - id: 27
    title: 'Docker y Podman: standalone local seguro'
    lessons:
      - id: '27.1'
        title: Contenedores frente a VMs y límites del aislamiento
      - id: '27.2'
        title: Prerrequisitos de CPU, runtime y almacenamiento
      - id: '27.3'
        title: Imágenes oficiales, tags, digest y compatibilidad de entrypoints
      - id: '27.4'
        title: 'Docker Engine y Podman: diferencias operativas'
      - id: '27.5'
        title: Rootless, rootful, UID/GID y permisos del proceso mongod
      - id: '27.6'
        title: Volúmenes nombrados, bind mounts y persistencia
      - id: '27.7'
        title: 'SELinux en Fedora: etiquetas de volúmenes y diagnóstico'
      - id: '27.8'
        title: Red privada, DNS de contenedores y publicación en loopback
      - id: '27.9'
        title: Standalone con configuración mongod.conf montada
      - id: '27.10'
        title: Bootstrap de administrador y roles con volumen vacío
      - id: '27.11'
        title: Datos existentes e idempotencia de inicialización
      - id: '27.12'
        title: CA local y certificados TLS con SAN de servicio
      - id: '27.13'
        title: Montaje de secretos, keyfiles y claves privadas con permisos
          efectivos
      - id: '27.14'
        title: Conexión mongosh con SCRAM, CA y TLS obligatorio
      - id: '27.15'
        title: Logs, health checks y parada ordenada
      - id: '27.16'
        title: Recursos, OOM y límites de almacenamiento
      - id: '27.17'
        title: Backup desde contenedor y restore en volumen nuevo
      - id: '27.18'
        title: Recreación, limpieza y conservación explícita de datos
    lab: Desplegar standalone persistente en Docker y repetir en Podman;
      protegerlo con SCRAM/TLS y restaurar datos en un volumen independiente.
    practical_labs:
      - name: 27-A — Standalone persistente
        task: Crear red y volumen, montar mongod.conf y bootstrap de usuarios
          según la imagen; escribir datos y recrear el contenedor.
        verify: Datos y usuarios persisten, URI funciona y el puerto sólo se
          publica en loopback cuando se necesita acceso del host.
      - name: 27-B — Standalone con TLS
        task: Crear CA y certificado con SAN correctos, aplicar requireTLS y
          montar claves con propietario y permisos adecuados.
        verify: Cliente con CA y usuario correcto conecta; conexiones sin TLS o
          con CA/hostname incorrectos fallan sin desactivar validación.
      - name: 27-C — Backup y restore
        task: Ejecutar dump autenticado con TLS y restaurar a instancia aislada
          y volumen nuevo.
        verify: Comparar contenido, recuentos, índices y validadores; comprobar
          explícitamente usuarios/roles según el ámbito del backup.
      - name: 27-D — Variante Podman
        task: Repetir persistencia y TLS con Podman; diagnosticar UID/GID,
          rootless y SELinux.
        verify: Reinicio conserva datos y los problemas se resuelven sin
          desactivar SELinux ni ampliar permisos indiscriminadamente.

  - id: 28
    title: 'Docker Compose y Podman: replica set, keyfile y operación'
    lessons:
      - id: '28.1'
        title: Compose Specification y selección de proveedor Compose en Podman
      - id: '28.2'
        title: Servicios, redes, volúmenes y configuración explícita por nodo
      - id: '28.3'
        title: DNS anunciado por los miembros y resolución desde el cliente
      - id: '28.4'
