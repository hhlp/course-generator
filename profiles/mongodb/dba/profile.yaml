        title: Anti-affinity, topology spread y capacidad de scheduling
      - id: '29.12'
        title: NetworkPolicy y requisitos del plugin de red
      - id: '29.13'
        title: Standalone didáctico con PVC y TLS
      - id: '29.14'
        title: 'Replica set manual con StatefulSet: utilidad y límites'
      - id: '29.15'
        title: Selección de operator y matriz de versiones y ediciones
      - id: '29.16'
        title: Instalar operator con manifiestos o Helm según soporte
      - id: '29.17'
        title: Recursos personalizados, bootstrap, keyfile y TLS según operator
      - id: '29.18'
        title: Acceso de clientes internos y externos y validación inicial
    lab: Desplegar standalone didáctico y después replica set gestionado por un
      operator compatible, con almacenamiento persistente, TLS y acceso
      limitado.
    practical_labs:
      - name: 29-A — Standalone didáctico
        task: Crear namespace, PVC, configuración, credenciales y certificados;
          desplegar una instancia sin exponerla públicamente.
        verify: Validar TLS y permisos desde cliente interno y repetir tras
          recrear el pod; identificar su ausencia de HA.
      - name: 29-B — Comprender StatefulSet
        task: Representar nombres estables y volúmenes de tres miembros y
          comparar un despliegue manual con el ciclo de reconciliación de un
          operator.
        verify: Explicar identidad pod/PVC, orden de bootstrap y por qué
          réplicas de Kubernetes no inicializan por sí mismas un replica set
          MongoDB.
      - name: 29-C — Replica set con operator
        task: Seleccionar versión compatible Community o Enterprise y usar su
          CRD, configuración de autenticación interna y TLS documentadas.
        verify: Operator reconciliado, tres miembros con datos, mayoría
          disponible y cliente con validación de certificados; no imponer campos
          de otra CRD.
      - name: 29-D — Red y scheduling
        task: Configurar acceso interno, políticas de red y colocación sobre
          nodos suficientes; ensayar un acceso diagnóstico mediante
          port-forward.
        verify: Tráfico permitido funciona y tráfico denegado falla; explicar
          limitaciones de port-forward para descubrimiento completo de
          topología.

  - id: 30
    title: 'Kubernetes: operación, seguridad y recuperación'
    lessons:
      - id: '30.1'
        title: Inventario de CRDs, recursos y estado reconciliado
      - id: '30.2'
        title: Mantenimiento con operator y prevención de drift manual
      - id: '30.3'
        title: PDB, eviction y límites ante fallos involuntarios
      - id: '30.4'
        title: Drain de nodo y preservación de mayoría
      - id: '30.5'
        title: 'Fallos de pod, nodo y zona: diferencias de alcance'
      - id: '30.6'
        title: PVC Pending, errores de attach y problemas de permisos
      - id: '30.7'
        title: Ampliación de volúmenes y soporte del CSI
      - id: '30.8'
        title: Rotación de credenciales, keyfile y certificados según operator
      - id: '30.9'
        title: Gestión externa de secretos y automatización PKI como extensiones
      - id: '30.10'
        title: Upgrade coordinado de MongoDB, operator, CRDs y Kubernetes
      - id: '30.11'
        title: Backups con Job o CronJob y herramientas compatibles
      - id: '30.12'
        title: Consistencia de VolumeSnapshots y límites del CSI
      - id: '30.13'
        title: Restore en namespace o clúster aislado
      - id: '30.14'
        title: Pérdida de PVC o clúster y reconstrucción de miembros
      - id: '30.15'
        title: Métricas, ServiceMonitor y reglas según stack instalado
      - id: '30.16'
        title: Logs, eventos, probes y diagnóstico de reconciliación
      - id: '30.17'
        title: Sharding gestionado en Kubernetes si la edición y operator lo
          permiten
      - id: '30.18'
        title: Runbooks, GitOps y revisión de readiness para producción
    lab: Operar el replica set bajo reconciliación, ejecutar mantenimiento y
      rotación, recuperar datos fuera del despliegue original y resolver
      incidentes de almacenamiento.
    practical_labs:
      - name: 30-A — Mantenimiento y fallo
        task: Evictar un pod o drenar un nodo respetando majority y PDB; después
          introducir un fallo involuntario acotado.
        verify: Medir disponibilidad del cliente y comprobar que PDB no evita
          todo tipo de fallo; separar pruebas de un nodo y multinodo.
      - name: 30-B — Rotación y upgrade
        task: Aplicar cambios por los recursos admitidos del operator, ensayar
          rotación y actualización sobre una copia previa.
        verify: Sin drift persistente, certificados validados, datos íntegros y
          compatibilidad del operator/servidor/CRD registrada.
      - name: 30-C — Backup y recuperación
        task: Programar backup consistente apropiado para la topología y
          restaurar en namespace aislado con PVC nuevos.
        verify: Validar contenido, índices y opciones; medir RPO/RTO y demostrar
          que exportar YAML no respalda los datos MongoDB.
      - name: 30-D — Incidentes y almacenamiento
        task: Simular PVC Pending, permiso incorrecto o presión de recursos;
          diagnosticar eventos, logs y estado MongoDB.
        verify: Recuperar el servicio sin borrar volúmenes ni forzar
          reconfiguración como primera medida; entregar línea temporal.
      - name: 30-E — Sharding condicionado
        task: Diseñar o ejecutar la topología sharded con los recursos admitidos
          por el operator y edición seleccionados.
        verify: Registrar soporte y costes; si no es ejecutable, entregar diseño
          explícito y ejecutar la variante local del bloque 28 sin atribuirle
          validación Kubernetes.

