      - id: '28.5'
        title: Generación y distribución del keyfile compartido
      - id: '28.6'
        title: Certificados por miembro y SAN para sus nombres anunciados
      - id: '28.7'
        title: Orden de bootstrap, primer usuario y autenticación interna
      - id: '28.8'
        title: Inicialización idempotente del replica set de tres miembros
      - id: '28.9'
        title: 'Health checks de proceso, readiness y primary: diferencias'
      - id: '28.10'
        title: URI de replica set y cliente en la red de contenedores
      - id: '28.11'
        title: >-
          Cliente en el host: nombres, puertos y límites de directConnection
      - id: '28.12'
        title: Conversión del standalone local a replica set conservando datos
      - id: '28.13'
        title: Failover, pérdida de miembro y reconexión del cliente
      - id: '28.14'
        title: Sustitución de secondary y reconstrucción de volumen
      - id: '28.15'
        title: Rotación rolling de keyfile y certificados
      - id: '28.16'
        title: Actualización rolling de imágenes y compatibilidad
      - id: '28.17'
        title: Podman Quadlet, systemd y persistencia del servicio
      - id: '28.18'
        title: Extensión sharded con Compose y límites del host único
    lab: Crear tres miembros persistentes con Compose, keyfile y TLS; medir
      failover, sustituir un miembro y demostrar restore y rotación.
    practical_labs:
      - name: 28-A — Replica set seguro desde cero
        task: Preparar config/ por nodo, red, tres volúmenes, keyfile y
          certificados; inicializar usuarios y rs0 siguiendo el procedimiento
          validado para la imagen.
        verify: Un primary, dos secondaries, cliente con replicaSet=rs0,
          escritura replicada y acceso no autorizado rechazado.
      - name: 28-B — Conversión de standalone
        task: Respaldar la instancia del bloque 27, detenerla ordenadamente,
          activar replicación y autenticación interna y añadir dos miembros.
        verify: Datos previos y usuarios se conservan; comprobar URI, roles,
          TLS, replicación e initial sync.
      - name: 28-C — Fallos y rotación
        task: Detener primary y sustituir secondary; ensayar rotación de keyfile
          y certificados con el método de la versión elegida.
        verify: Medir interrupción, confirmar mayoría y escritura desde el
          cliente; no reiniciar simultáneamente todos los miembros.
      - name: 28-D — Restore y servicio Podman
        task: Restaurar a un entorno aislado y representar el servicio
          persistente con Quadlet; verificar qué funciones dependen del
          proveedor Compose.
        verify: Datos recuperados, arranque ordenado y diferencias Docker/Podman
          documentadas; no asumir equivalencia automática.
      - name: 28-E — Sharding en contenedores
        task: Adaptar la topología del bloque 20 a dos shards replicados, CSRS
          de tres y dos routers, por fases si faltan recursos.
        verify: Cliente vía mongos, distribución de datos y recuperación de un
          proceso; distinguirlo de tolerancia a la pérdida del host.

  - id: 29
    title: 'Kubernetes: arquitectura y despliegue MongoDB'
    lessons:
      - id: '29.1'
        title: Prerrequisitos de Kubernetes y elección del laboratorio local
      - id: '29.2'
