name: sql
title: SQL DE 0 A EXPERTO — SQL ESTÁNDAR + POSTGRESQL
platform: Fedora Linux + PostgreSQL 18

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

scope:
  primary_language: SQL
  sql_standard_first: true
  primary_dbms: PostgreSQL
  primary_postgresql_version: "18"
  compare_other_dbms_only_when_useful: true
  comparison_dbms:
    - MySQL
    - MariaDB
    - SQLite
  preferred_environment: Fedora Linux
  programming_languages: false
  windows: false

sql_policy:
  distinguish_sql_standard_from_postgresql: true
  mark_postgresql_extensions_explicitly: true
  explain_portability_when_relevant: true
  prefer_standard_sql_when_equally_expressive: true
  use_postgresql_when_engine_specific_behavior_is_required: true
  do_not_teach_mysql_syntax_as_generic_sql: true
  do_not_teach_postgresql_extensions_as_sql_standard: true
  distinguish_relational_model_from_sql_language: true
  distinguish_logical_query_semantics_from_physical_execution: true

postgresql_policy:
  primary_reference_version: "18"
  use_psql_for_interactive_labs: true
  use_explain_for_performance_topics: true
  use_explain_analyze_only_when_execution_is_safe: true
  use_system_catalogs_for_introspection_topics: true
  use_pg_stat_views_for_observability_topics: true
  include_mvcc_and_storage_internals_at_advanced_levels: true
  include_source_code_orientation_at_expert_levels: true
  distinguish_documented_behavior_from_implementation_detail: true
  avoid_superuser_when_not_required: true
  prefer_reproducible_local_labs: true

lesson_structure:
  objective:
    required: true
    position: first

  reading:
    required: true
    categories:
      - principal
      - normativa
      - postgresql
      - profundizacion
      - rendimiento
      - internals
      - consulta
    exact_references_only_when_verified: true

  lab:
    required: false

  common_errors:
    required: false

  important_idea:
    required: false

  remember:
    required: true
    position: last
    min_items: 3
    max_items: 7

quality:
  forbid_generic_scaffold: true
  require_topic_specific_headings: true
  require_topic_specific_examples: true
  require_self_contained_lesson: true
  require_progressive_depth: true
  require_correct_null_semantics: true
  require_correct_duplicate_semantics: true
  require_correct_transaction_semantics: true
  require_standard_vs_vendor_distinction: true
  require_evidence_for_performance_claims: true
  forbid_unmeasured_optimization_claims: true
  audit_before_save: true
  repair_on_fail: true

examples:
  default_schema: lab
  favor_small_reproducible_datasets: true
  expand_to_large_datasets_for_performance_lessons: true
  show_expected_result_when_pedagogically_useful: true
  avoid_magic_data: true
  preserve_null_and_duplicate_edge_cases: true

performance_policy:
  measure_before_optimizing: true
  require_explain_for_plan_claims: true
  prefer_explain_analyze_buffers_for_runtime_analysis: true
  compare_estimated_vs_actual_rows: true
  inspect_statistics_before_recommending_indexes_when_relevant: true
  consider_write_cost_of_indexes: true
  distinguish_cpu_io_memory_lock_contention: true
  validate_semantic_equivalence_after_rewrite: true

security_policy:
  teach_parameterized_queries: true
  teach_least_privilege: true
  teach_safe_security_definer: true
  teach_search_path_risks: true
  teach_row_level_security: true
  never_present_string_concatenation_as_safe_parameterization: true

artifacts:
  enabled: true
  default_strategy: auto
  overrides:
    "195.59":
      strategy: diagnostic_project
      project_type: diagnostic
      project_id: sql-postgresql-debugger
      validation_required: true
    "196.50":
      strategy: final_integrator_project
      project_type: integrator
      project_id: sql-postgresql-final
      validation_required: true

  project_policy:
    integrator_projects: auto
    diagnostic_projects: auto
    require_project_for_every_block: false

output:
  format: markdown
  zip_block: true
  write_index: true
  write_manifest: true

validation:
  enabled: false
  commands: []
