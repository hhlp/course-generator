---
course:
  title: "SQL — 0 a Experto en Profundidad"
  language: "es"
  level:
    start: "cero"
    end: "experto"
  platform:
    primary: PostgreSQL
    cli: psql
    reference_major: 18
    record_exact_server_version: true
  description: >
    Curso profundo de SQL como lenguaje de consulta, transformación, análisis,
    manipulación y programación de datos, usando PostgreSQL como plataforma
    práctica. Excluye normalización y diseño relacional, cubiertos por el
    PATH Database Design.
  mode: "deep"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

dialect_policy:
  primary: PostgreSQL
  sql_concept_first: true
  postgresql_implementation_second: true
  prefer_standard_sql_when_reasonable: true
  explain_differences_when_relevant: true
  label_postgresql_specific_features: true
  avoid:
    - silently using MySQL syntax
    - silently using MariaDB syntax
    - presenting PostgreSQL extensions as standard SQL

scope:
  include:
    - SQL querying
    - filtering
    - expressions
    - NULL semantics
    - aggregation
    - joins
    - conditional logic
    - CTEs
    - recursive CTEs
    - set operations
    - subqueries
    - self joins
    - window functions
    - advanced aggregation
    - views
    - materialized views
    - temporary tables
    - automatically updatable views
    - WITH CHECK OPTION
    - security_invoker and security_barrier views
    - INSTEAD OF triggers on views
    - PostgreSQL built-in functions and operators
    - PostgreSQL range and multirange types
    - PostgreSQL full-text search
    - PostgreSQL SQL/JSON
    - CREATE FUNCTION
    - SQL-language functions
    - set-returning functions
    - PL/pgSQL
    - stored functions
    - stored procedures
    - CREATE PROCEDURE and CALL
    - trigger functions
    - row and statement triggers
    - transition relations
    - event triggers from the SQL-programming perspective
    - dynamic SQL
    - PL/pgSQL exception handling
    - DML
    - transactions from SQL
    - locking from SQL
    - PostgreSQL arrays
    - PostgreSQL JSON and JSONB querying
    - analytical SQL
    - advanced query patterns
    - EXPLAIN
    - EXPLAIN ANALYZE
    - query-plan interpretation
    - query optimization
    - SQL correctness
    - SQL maintainability
    - PostgreSQL routine safety and maintainability

  exclude:
    - database normalization
    - 1NF
    - 2NF
    - 3NF
    - BCNF
    - higher normal forms
    - functional dependencies
    - multivalued dependencies
    - join dependencies
    - ER modeling
    - conceptual database design
    - logical database design
    - physical database design as a discipline
    - relational schema decomposition
    - denormalization theory
    - derived-attribute storage design decisions

boundary:
  database_design_path: "Relational Database Design"
  rule: >
    Primary keys, foreign keys, constraints and indexes may be discussed only
    when needed to understand SQL semantics, joins, DML integrity errors,
    cardinality, query plans or query performance. Their schema-design theory
    belongs to the Database Design path.

pedagogy:
  progression:
    - syntax
    - semantics
    - examples
    - edge_cases
    - common_errors
    - laboratory
  lesson_start: "🎯 OBJETIVO"
  lesson_end: "🧠 QUÉ DEBES RECORDAR"
  optional_sections:
    - "🧪 Laboratorio"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
    - "📚 LECTURA"
  emphasize:
    - executable SQL examples
    - query correctness
    - NULL behavior
    - row cardinality
    - duplicate handling
    - query composition
    - PostgreSQL behavior
    - query-plan evidence
    - progressive laboratories

laboratories:
  primary_dataset:
    name: "DVD Rental (dvdrental)"
    provider: Neon
    url: "https://neon.com/postgresql/getting-started/sample-database"
    role: canonical
  prefer_primary_dataset: true
  allow_minimal_ad_hoc_datasets: true
  ad_hoc_dataset_purpose:
    - edge cases
    - semantic demonstrations
    - controlled experiments
  execution:
    - psql
    - SQL files
  use_for:
    - examples
    - exercises
    - joins
    - aggregation
    - subqueries
    - CTEs
    - set operations
    - window functions
    - views
    - materialized views
    - SQL functions
    - PL/pgSQL functions
    - procedures
    - triggers when reproducible
    - reproducible DML
    - EXPLAIN
    - EXPLAIN ANALYZE
    - query optimization

references:
  authoritative:
    - name: "PostgreSQL Official Documentation"
      role: authoritative
      purpose:
        - syntax
        - semantics
        - PostgreSQL behavior
        - query planning
        - query optimization
        - PostgreSQL functions and operators
        - PL/pgSQL semantics
        - procedures and triggers
        - views and materialized views

  primary:
    - "Head First SQL, 2nd Edition — Kimberley Fessel"
    - "Beginning SQL Queries: From Novice to Professional, 2nd Edition
      — Clare Churcher"
    - "Learning SQL, 3rd Edition — Alan Beaulieu"
    - "SQL Cookbook, 2nd Edition — Anthony Molinaro, Robert de Graaf"
    - "SQL for Data Analysis: Advanced Techniques for Transforming Data
      into Insights — Cathy Tanimura"
    - "SQL for Data Analytics, Fourth Edition — Packt"
    - "SQL in a Nutshell, 4th Edition — Kevin Kline, Regina O. Obe, Leo S. Hsu"
    - "SQL for Data Analytics, Third Edition — Packt"
    - "SQL Essentials for Data Analysis: A 50-Day Hands-on Challenge Book
      — Benjamin Bennett Alexander"

  bibliography_roles:
    fundamentals:
      - "Head First SQL, 2nd Edition"
      - "Beginning SQL Queries, 2nd Edition"
      - "Learning SQL, 3rd Edition"
    patterns_and_recipes:
      - "SQL Cookbook, 2nd Edition"
    reference:
      - "SQL in a Nutshell, 4th Edition"
    analytics:
      - "SQL for Data Analysis"
      - "SQL for Data Analytics, Fourth Edition"
      - "SQL for Data Analytics, Third Edition"
    deliberate_practice:
      - "SQL Essentials for Data Analysis: A 50-Day Hands-on Challenge Book"

  tutorials:
    - name: "Neon PostgreSQL Tutorial"
      url: "https://neon.com/postgresql/tutorial"
      role: complementary
      purpose:
        - explanations
        - examples
        - exercises
        - laboratories

source_policy:
  engine_behavior:
    prefer:
      - PostgreSQL Official Documentation
  conceptual_explanation:
    prefer:
      - primary bibliography
      - PostgreSQL Official Documentation
      - Neon PostgreSQL Tutorial
  practical_examples:
    prefer:
      - PostgreSQL Sample Database
      - Neon PostgreSQL Tutorial
  mysql_examples:
    adaptation:
      enabled: true
      target_engine: PostgreSQL
      target_dataset: PostgreSQL Sample Database
      preserve_sql_concept: true
      explain_dialect_differences: true

final_project:
  name: "PostgreSQL SQL Query & Database Programming"
  deliverables:
    - reproducible SQL query collection
    - analytical queries
    - window-function queries
    - complex joins and CTEs
    - DML examples
    - EXPLAIN ANALYZE evidence
    - query correctness validation
    - reusable views and materialized views
    - SQL-language functions
    - PL/pgSQL functions
    - stored procedure examples
    - justified trigger implementation
    - routine safety and performance validation
    - deterministic fixtures and expected results
    - independent concurrent-session scenario
    - exact PostgreSQL server version and optional extensions
    - dataset checksum and restoration instructions
    - clean execution and reset instructions

deep_learning_requirements:
  preserve_existing_blocks_and_lessons: true
  require_for_advanced_lessons:
    - syntax_and_semantics
    - assumptions_and_edge_cases
    - executable_postgresql_examples
    - counterexamples_and_common_errors
    - reproducible_verification
    - performance_or_concurrency_when_relevant
  emphasize_topics:
    - sql_correctness_and_equivalence
    - window_frame_semantics
    - mvcc_and_transaction_retries
    - explain_and_plan_estimation
    - sql_injection_and_secure_routines
    - regression_testing
  version_policy:
    document_postgresql_server_version: true
    verify_version_dependent_syntax_against_official_docs: true
    optional_extensions_must_be_labeled: true

sql_testing:
  enabled: true
  reproducible_psql_scripts: true
  stop_on_error: true
  fixtures_and_expected_results: true
  required_edge_cases:
    - nulls
    - duplicates
    - empty_sets
    - cardinality_changes
  validation_methods:
    - except_all_both_directions
    - invariants
    - regression_tests
    - concurrent_session_scenarios
  optional_tools:
    - pgTAP
  capstone_required: true

revision_execution_policy:
  official_documentation_base: "https://www.postgresql.org/docs/18/"
  dataset:
    archive: dvdrental.tar
    restore_tool: pg_restore
    record_download_checksum: true
    disposable_database: true
    reset_instructions_required: true
  prerequisite_bridges:
    count_before_aggregation: guided_introduction
    exists_before_subqueries: guided_introduction
    updatable_views_before_dml: guided_dml_and_rollback_capsule
    view_triggers_before_trigger_block: conceptual_preview
  progression:
    plan_basics: 15
    advanced_plan_diagnosis: 24
    integration_with_new_problems: 33
  scope_clarifications:
    fixture_ddl_on_provided_schemas: allowed
    object_grant_revoke_for_interface_tests: allowed
    derived_value_trigger_implementation: predefined_requirement_only
    derived_value_storage_decision: excluded

equivalence_testing_policy:
  counterexample_can_refute_equivalence: true
  passing_fixtures_prove_universal_equivalence: false
  except_all_compares: bags_for_tested_inputs
  require_comparable_types: true
  use_same_snapshot_or_immutable_inputs: true
  separately_check_when_relevant:
    - output_order
    - output_types
    - raised_errors
    - side_effects
