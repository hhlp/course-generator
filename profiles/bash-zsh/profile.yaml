name: bash-zsh
title: BASH-ZSH EN PROFUNDIDAD
platform: Fedora Linux

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

scope:
  windows: false
  preferred_environment: Fedora Linux
  primary_shells:
    - bash
    - zsh
  portability_reference:
    - posix-sh

shell_policy:
  distinguish_posix_sh: true
  distinguish_bash: true
  distinguish_zsh: true
  never_present_extensions_as_portable: true
  compare_dialects_when_relevant: true
  prefer_native_shell_examples: true
  verify_version_specific_behavior: true
  label_non_posix_examples: true
  explain_portability_implications: true

example_policy:
  prefer_safe_quoting: true
  explain_word_splitting: true
  explain_globbing_when_relevant: true
  avoid_unsafe_eval: true
  avoid_unquoted_expansions: true
  show_exit_status_when_relevant: true
  show_stderr_stdout_when_relevant: true

lesson_structure:
  objective:
    required: true
    position: first
    heading: "🎯 OBJETIVO"

  reading:
    required: true
    heading: "📚 LECTURA"
    categories:
      - principal
      - normativa
      - motor
      - profundizacion
      - consulta
    exact_references_only_when_verified: true

  lab:
    required: false
    heading: "🧪 Laboratorio/ejemplos"

  common_errors:
    required: false
    heading: "⚠️ Errores frecuentes"

  important_idea:
    required: false
    heading: "💡 Idea importante"

  remember:
    required: true
    position: last
    heading: "🧠 QUÉ DEBES RECORDAR"
    min_items: 3
    max_items: 7

quality:
  forbid_generic_scaffold: true
  require_topic_specific_headings: true
  require_topic_specific_examples: true
  require_self_contained_lesson: true
  audit_before_save: true
  repair_on_fail: true

output:
  format: markdown
  zip_block: true
  write_index: true
  write_manifest: true

artifacts:
  enabled: true
  default_strategy: auto
  overrides: {}

  project_policy:
    integrator_projects: auto
    diagnostic_projects: auto
    require_project_for_every_block: false

validation:
  enabled: false
  commands: []
