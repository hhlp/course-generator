name: javascript
title: "JavaScript — 0 a experto"
language: es
audience: "Estudiantes y profesionales que quieren dominar JavaScript desde los fundamentos hasta ECMAScript, runtimes, concurrencia y arquitectura avanzada."
level: "0-a-experto"

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  style: "profundo, práctico, progresivo y orientado a comprensión real del lenguaje y sus runtimes"
  lesson_structure:
    objective:
      required: true
      position: first
      heading: "🎯 OBJETIVO"
    reading:
      required: true
      heading: "📚 LECTURA"
      categories:
        - principal
        - normativa
        - runtime
        - profundizacion
        - consulta
      exact_references_only_when_verified: true
    lab:
      required: false
      heading: "🧪 Laboratorio/ejemplos"
    common_errors:
      required: false
      heading: "⚠️ Errores frecuentes"
    important_idea:
      required: false
      heading: "💡 Idea importante"
    remember:
      required: true
      position: last
      heading: "🧠 QUÉ DEBES RECORDAR"
      min_items: 3
      max_items: 7
  indentation: false
  numbering: single-level

content:
  javascript_standard: "ECMAScript moderno"
  runtimes:
    - browser
    - nodejs
  distinguish_language_from_host_apis: true
  explain_runtime_behavior: true
  include_executable_examples: true
  include_internal_models_when_relevant: true
  include_common_errors: true
  include_security_implications: true
  include_performance_implications: true
  frameworks_are_integration_topics: true

progression:
  - fundamentos
  - lenguaje
  - estructuras_de_datos
  - funciones
  - prototypes_y_classes
  - iteracion_y_metaprogramacion
  - browser
  - networking
  - asincronia
  - event_loop
  - concurrencia
  - nodejs
  - streams
  - tooling_y_testing
  - seguridad_y_performance
  - ecmascript_internals
  - motores
  - arquitectura
  - cross_platform
  - experto
  - proyecto_final

bibliography_policy:
  prefer_official_sources_for_current_behavior: true
  exact_references_only_when_verified: true
  do_not_invent_pages_or_chapters: true
