course:
  title: "JavaScript — 0 a Experto"
  language: "es"
  level: "0 → experto"
  runtime_focus: "Node.js"
  browser_focus: "secundario"
  specification: "ECMAScript / ECMA-262"

pedagogy:
  style: "profundo, práctico, progresivo y orientado a comprensión real del lenguaje y runtime"
  lesson_structure:
    required_opening: "🎯 OBJETIVO"
    required_closing: "🧠 QUÉ DEBES RECORDAR"
    optional_sections:
      - "📚 LECTURA"
      - "🧪 Laboratorio/ejemplos"
      - "⚠️ Errores frecuentes"
      - "💡 Idea importante"
  closing_requirements:
    min_points: 3
    max_points: 7
    avoid_repeating_objective: true
  indentation: false
  numbering: "single-level"

lesson_structure:
  objective:
    required: true
    position: first
    heading: "🎯 OBJETIVO"
  reading:
    required: true
    heading: "📚 LECTURA"
    categories:
      - principal
      - conceptual_depth
      - normativa
      - runtime
      - concurrencia
      - motor
      - profundizacion
      - consulta
    exact_references_only_when_verified: true
  lab:
    required: false
    heading: "🧪 Laboratorio/ejemplos"
  common_errors:
    required: false
    heading: "⚠️ Errores frecuentes"
  important_idea:
    required: false
    heading: "💡 Idea importante"
  remember:
    required: true
    position: last
    heading: "🧠 QUÉ DEBES RECORDAR"
    min_items: 3
    max_items: 7

content:
  code_examples: true
  runnable_examples_preferred: true
  explain_language_vs_host: true
  explain_pedagogical_vs_normative_model: true
  explain_specification_when_relevant: true
  avoid_unverified_exact_book_pages: true
  async_concurrency_depth: "expert"
  conceptual_depth_topics:
    - types
    - coercion
    - scope
    - closures
    - functions
    - this
    - objects
    - prototypes
    - classes
    - async
  async_topics:
    - callbacks
    - promises
    - async_await
    - async_iterators
    - event_loop
    - jobs_and_microtasks
    - cancellation
    - abort_controller
    - timeouts
    - concurrency_limits
    - queues
    - producer_consumer
    - backpressure
    - worker_threads
    - worker_pools
    - message_passing
    - transferables
    - shared_array_buffer
    - atomics
    - race_conditions
    - deadlock_livelock_starvation
    - agents_and_agent_clusters
    - async_hooks
    - async_local_storage
    - profiling

bibliography:
  principal:
    - "JavaScript: The Definitive Guide, 7th Edition — David Flanagan"
    - "Head First JavaScript Programming, Second Edition — Eric Freeman, Elisabeth Robson"
    - "JavaScript Cookbook: Programming the Web, 3rd Edition — Adam D. Scott, Matthew MacDonald et al."
  conceptual_depth:
    - title: "You Don't Know JS Yet"
      author: "Kyle Simpson"
      role: "deep_language_models"
      priority_topics:
        - types
        - coercion
        - scope
        - closures
        - functions
        - this
        - objects
        - prototypes
        - classes
        - async
      normative_authority: false
  concurrency:
    - "Multithreaded JavaScript: Concurrency Beyond the Event Loop — Thomas Hunter II, Bryan English"
  ecosystem:
    - "JavaScript Everywhere — Adam D. Scott"
  normative:
    - "ECMA-262"
    - "TC39"
    - "Node.js official documentation"
    - "MDN Web Docs"

source_policy:
  normative_precedence:
    - "ECMA-262"
    - "official runtime documentation"
    - "verified current documentation"
  conceptual_sources_support_understanding: true
  books_do_not_override_current_specification: true
  exact_chapter_or_page_references_only_when_verified: true
  do_not_attribute_unverified_content_to_book_volumes: true

assessment:
  require_reasoning: true
  require_debugging: true
  require_labs: true
  final_project: true
  final_project_topics:
    - esm
    - async_processing
    - streams
    - backpressure
    - worker_threads
    - testing
    - profiling
    - ast
    - security
