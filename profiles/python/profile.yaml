---
course:
  title: Python 3.15 — 0 a Experto en Profundidad
  language: es
  level:
    start: cero
    end: experto
    platform:
      - Fedora
      - Linux
  mode: deep

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

lesson_structure:
