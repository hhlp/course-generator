---
course:
  title: "Vagrant 0 → Experto — Fedora, KVM/QEMU y libvirt en Profundidad"
  language: "es"
  level:
    start: "cero"
    end: "experto"
  mode: "deep"
  platform:
    host_os: Fedora
    guest_os:
      - Fedora
      - Linux
    virtualization:
      - KVM
      - QEMU
      - libvirt
    vagrant_provider: libvirt
  scope:
    primary:
      - Vagrant
      - Vagrantfile
      - vagrant-libvirt
      - boxes
      - networking
      - storage
      - synced folders
      - provisioning
      - multi-machine
      - snapshots
      - troubleshooting
      - security
      - performance
      - internals
  integrations:
    - Ansible
    - Packer
    - Terraform
    - OpenTofu
  secondary_only:
    - VirtualBox
    - VMware
    - Hyper-V

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  style: profundo, práctico, progresivo y orientado a administración real
  lesson_structure:
    objective:
      required: true
      position: first
      heading: "🎯 OBJETIVO"
    reading:
      required: true
      heading: "📚 LECTURA"
      categories:
        - principal
        - normativa
        - motor
        - profundizacion
        - consulta
      exact_references_only_when_verified: true
    lab:
      required: true
      heading: "🧪 Laboratorio/ejemplos"
    common_errors:
      required: false
      heading: "⚠️ Errores frecuentes"
    important_idea:
      required: false
      heading: "💡 Idea importante"
    remember:
      required: true
      position: last
      heading: "🧠 QUÉ DEBES RECORDAR"
      min_items: 3
      max_items: 7
  closing_requirements:
    min_points: 3
    max_points: 7
    avoid_repeating_objective: true
  indentation: false
  numbering: single-level

content_requirements:
  explain_why_not_only_how: true
  prefer_current_fedora_practices: true
  distinguish_layers:
    - Vagrant
    - vagrant-libvirt
    - libvirt
    - QEMU
    - KVM
  commands_must_be_explained: true
  destructive_commands_require_warning: true
  troubleshooting_required_when_relevant: true
  security_context_required_when_relevant: true
  reproducible_labs: true
  avoid_tool_overlap: true

labs:
  progression:
    - single_vm
    - vagrantfile
    - networking
    - storage
    - provisioning
    - multi_machine
    - ansible
    - custom_box
    - packer
    - final_project

final_project:
  required: true
  description: >
    Laboratorio Fedora multi-machine sobre KVM/libvirt administrado con
    Vagrant y configurado mediante Ansible, incluyendo networking, storage,
    SELinux, firewalld, snapshots, logging, troubleshooting, tests y
    documentación. Packer se utiliza como extensión para construir la box.
  must_be_destroyable_and_reproducible: true

bibliography_policy:
  books_are_conceptual_sources: true
  official_docs_for_current_behavior: true
  exact_references_only_when_verified: true
  do_not_invent_pages_or_sections: true

deep_coverage:
  mandatory_for_operational_lessons:
    - architecture_and_prerequisites
    - installation_or_setup
    - configuration_with_explanations
    - commands_and_options
    - expected_output_and_validation
    - security_and_permissions
    - logs_and_troubleshooting
    - reproducible_lab_and_cleanup
  distinguish_capability_layers:
    - vagrant_core
    - vagrant_libvirt_provider
    - libvirt
    - qemu_kvm
    - fedora_host_and_guest
  provider_compatibility_must_be_verified: true
  do_not_assume_libvirt_features_exposed_by_provider: true
  avoid_unverified_version_specific_commands: true
  include_failure_injection_in_advanced_labs: true
  explain_recovery_and_rollback: true
  require_logs_and_expected_results: true
  include_security_supply_chain: true
  require_reproducible_destroy_and_rebuild: true
  assessment:
    require_block_acceptance_criteria: true
    require_operational_labs: true
    require_idempotency_checks_when_applicable: true
    require_troubleshooting_evidence: true
    final_project_tests:
      - clean_environment_bootstrap
      - multi_machine_connectivity
      - dns_and_ssh_validation
      - ansible_idempotency
      - snapshot_and_recovery_validation
      - performance_baseline
      - full_destroy_and_rebuild
      - documentation_and_runbook

progression_policy:
  teach_minimal_ruby_in_vagrantfile_block: true
  advanced_ruby_block: 17
  multi_machine_block: 10
  ansible_block: 11
  prerequisites_before_labs: true
  labs_at_end_of_each_block: true

lab_policy:
  operational_lessons_require_practice: true
  conceptual_lessons_may_use_reasoned_examples: true
  practice_may_be_a_verified_phase_of_block_lab: true
  operational_blocks_require_at_least_one_lab: true
  acceptance_criteria_required: true
  cleanup_required: true

reproducibility_policy:
  record_tool_versions_and_artifact_checksums: true
  identify_package_and_repository_inputs: true
  verify_functional_equivalence: true
  do_not_claim_binary_determinism_without_evidence: true

integration_validation:
  yaml_syntax_is_not_loader_compatibility: true
  verify_pedagogy_path_in_target_repository: true
