---
course:
  title: "GO — DE 0 A EXPERTO Profundidad"
  description: "Learning Path profundo de Go: lenguaje, concurrencia,
      servicios, runtime, profiling, performance e internals."
  language: "es"
  level:
    start: "cero"
    end: "experto"
  platform:
    - Fedora
    - Linux
  mode: "deep"
  official_docs_priority: true

files:
  pedagogy: ../../config/pedagogy.md
  domain: domain.md
  bibliography: bibliography.md

pedagogy:
  opening_section: "🎯 OBJETIVO"
  closing_section: "🧠 QUÉ DEBES RECORDAR"
  closing_key_points_min: 3
  closing_key_points_max: 7
  optional_sections:
    - "🧪 Laboratorio/ejemplos"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
  reading_section: "📚 LECTURA"

code:
  language: go
  format_with_gofmt: true
  runnable_examples: true
  prefer_standard_library: true
  explain_output_when_useful: true

focus:
  - lenguaje Go y programación idiomática
  - biblioteca estándar
  - complejidad algorítmica y Big O aplicado a Go
  - expresiones regulares con regexp y RE2
  - desarrollo profesional de CLI
  - packages, modules y workspaces
  - errores como valores
  - generics
  - goroutines y channels
  - sincronización y Go Memory Model
  - context y cancelación
  - networking y HTTP
  - database/sql
  - testing, fuzzing y race detector
  - seguridad y govulncheck
  - runtime y scheduler
  - compiler e internals
  - profiling y tracing
  - performance engineering y PGO
  - producción, contenedores y Kubernetes

references:
  principal:
    - "Learning Go — Jon Bodner"
  performance:
    - "Efficient Go — Bartłomiej Płotka"
  concurrency:
    - "Learn Concurrent Programming with Go — James Cutajar"
  professional:
    - "Go in Action, Second Edition — Joel Holmes, Andrew Walker,
        William Kennedy"
  cookbook:
    - "Go Cookbook: Expert Solutions for Commonly Needed Go
        Tasks — Sau Sheong Chang"
  authoritative:
    - "Official Go Documentation"
    - "The Go Programming Language Specification"
    - "Go Memory Model"
    - "Go standard library documentation"

quality:
  avoid_superficial_summaries: true
  explain_tradeoffs: true
  include_common_errors: true
  cumulative_labs: true
  final_project: true
  preserve_all_existing_lessons: true
  complexity_analysis_with_assumptions: true
  regex_go_specific_not_general_theory: true
  benchmarks_are_not_asymptotic_proofs: true
  cli_standard_library_first: true

specializations:
  big_o:
    focus: "Complejidad aplicada a estructuras, algoritmos y
        concurrencia en Go"
    cross_reference_general_path: true
    require_time_and_space_analysis: true
    require_benchmarks_and_profiling: true
  regex:
    engine: "RE2 / Go regexp"
    cross_reference_general_path: true
    require_utf8_byte_index_explanation: true
    require_tests_fuzzing_benchmarks: true
  cli:
    prefer_standard_library: true
    require_signal_handling: true
    require_exit_code_and_stream_testing: true
