name: firewalld
title: "FIREWALLD EN PROFUNDIDAD — FEDORA"
language: es
platform: Fedora
level: "0 a experto"

course:
  subject: firewalld
  scope:
    - firewalling en Linux
    - firewalld
    - nftables como backend y capa de diagnóstico
    - NetworkManager
    - systemd
    - SELinux
    - IPv4 e IPv6
  goal: >
    Dominar firewalld en Fedora desde los fundamentos del filtrado de paquetes
    hasta diseño, automatización, diagnóstico, seguridad e integración con el
    stack de red del sistema.

pedagogy:
  opening_section: "🎯 OBJETIVO"
  closing_section: "🧠 QUÉ DEBES RECORDAR"
  closing_key_points:
    min: 3
    max: 7
  depth: profunda
  style:
    - didáctico
    - técnico
    - progresivo
    - orientado a administración real
    - explicar el porqué además del cómo
  optional_sections:
    - "🧪 Laboratorio/ejemplos"
    - "⚠️ Errores frecuentes"
    - "💡 Idea importante"
  rules:
    - "No convertir la lección en un simple resumen."
    - "Relacionar cada tema con Fedora y firewalld."
    - "Distinguir claramente runtime y permanent cuando corresponda."
    - "Explicar la relación entre firewalld y nftables sin confundir sus niveles de abstracción."
    - "Incluir comandos reproducibles y explicar sus efectos."
    - "Advertir de operaciones que puedan cortar conectividad remota."
    - "Cubrir IPv4 e IPv6 cuando el concepto aplique."
    - "Usar ejemplos seguros y verificables."
    - "Mantener continuidad con las lecciones vecinas del PATH."

commands:
  primary:
    - firewall-cmd
    - firewall-offline-cmd
    - firewallctl
    - systemctl
    - journalctl
    - nft
    - ip
    - ss
    - nmcli
    - getenforce
    - semanage
  verification:
    - "firewall-cmd --state"
    - "firewall-cmd --get-active-zones"
    - "firewall-cmd --list-all"
    - "firewall-cmd --list-all-zones"
    - "nft list ruleset"
    - "journalctl -u firewalld"

context:
  path_blocks: "0–26"
  final_project: true
  companion_files:
    domain: domain.md
    bibliography: bibliography.md
